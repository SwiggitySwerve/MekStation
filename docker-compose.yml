# MekStation - Docker Compose Configuration
#
# Usage:
#   Development:  docker-compose up dev
#   Production:   docker-compose up app
#   Build:        docker-compose build
#
# Environment variables can be set in .env file
#
# Ports are published on 127.0.0.1 only. Remote or LAN access is NOT
# supported: the server's same-host guard trusts a loopback Host header and
# the local API has no network authentication, so a port published on all
# interfaces would expose it to any peer that can reach this machine.

version: '3.8'

services:
  # ==========================================================================
  # Production Application
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mekstation
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-3600}:3600'
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/mekstation.db
    volumes:
      # Persist SQLite database and user data
      - mekstation-data:/app/data
      # Optional: Mount custom unit files
      # - ./custom-units:/app/public/data/units/custom:ro
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3600/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # No reverse-proxy (traefik) labels: behind a proxy the Host header is the
    # public name, which the same-host guard refuses for every API request and
    # WebSocket upgrade. Proxy and remote deployments are unsupported.

  # ==========================================================================
  # Development Server with Hot Reload
  # ==========================================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mekstation-dev
    ports:
      - '127.0.0.1:${DEV_PORT:-3600}:3600'
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
      # Persist dev database
      - mekstation-data-dev:/app/data
    command: npm run dev

  # ==========================================================================
  # Database Backup Service (optional)
  # ==========================================================================
  backup:
    image: alpine:latest
    container_name: mekstation-backup
    volumes:
      - mekstation-data:/data:ro
      - ./backups:/backups
    command: |
      sh -c 'while true; do
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
        cp -r /data /backups/backup_$$TIMESTAMP;
        find /backups -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
        sleep 86400;
      done'
    profiles:
      - backup

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  mekstation-data:
    driver: local
    name: mekstation-data
  mekstation-data-dev:
    driver: local
    name: mekstation-data-dev

# ==========================================================================
# Networks
# ==========================================================================
networks:
  default:
    name: mekstation-network
