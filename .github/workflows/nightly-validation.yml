name: Nightly Validation

# ---------------------------------------------------------------
# Scheduled full-size enforcement lane (2026-06-09 audit, cluster E;
# remediation tracker W4.4). The PR pipeline targets ~5 minutes, so
# PR lanes run shrunken smoke counts and a single Playwright spec.
# This workflow runs the proofs the PR pipeline legitimately cannot
# afford, daily on main:
#   - E-2: perf budget assertions actually execute in CI
#     (SIMULATION_PERF_ASSERTIONS=true overrides the shard exclusion)
#   - E-4: statistical existence assertions engage at full batch sizes
#   - E-5: pilot-skill >=10pp win-rate proofs at the N=100 default
#     (statisticalIt gates open because no shrink env vars are set)
#   - E-6: swarm throughput at the spec'd 1,000-run / 60s scale
#     (openspec/specs/quick-session/spec.md, "Throughput target met
#     for 1,000 runs")
#   - E-1 remainder: the FULL Playwright suite on chromium (the PR
#     e2e-smoke lane runs only tactical-map-visual-smoke.spec.ts)
#   - E-9: jest.config.js coverageThreshold enforced via a coverage run
#
# No detect-changes/paths-filter gating here: scheduled runs have no
# diff to filter on and must always validate everything.
# ---------------------------------------------------------------

on:
  schedule:
    # Daily at 09:00 UTC.
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Warms the shared node_modules cache so the fan-out lanes restore
  # instead of each running their own `npm ci` (same pattern as
  # pr-checks.yml).
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

  # ---------------------------------------------------------------
  # Full-size statistical + perf proofs (E-2/E-4/E-5/E-6).
  #
  # Runs the four perf-sensitive simulation suites PLUS
  # simulation.test.ts (home of the E-2 perfIt budgets) at their
  # DEFAULT batch counts — deliberately NO count-shrink env vars
  # (SIMULATION_COUNT, *_BATCH_COUNT), so every statisticalIt gate
  # opens and the existence/win-rate proofs run with real teeth:
  #   - integration.test.ts: N=100 statistical batch + N=100 profile
  #   - simulation-combat-integration.test.ts: 20/200/50/50 batches
  #   - swarm-pilot-skills-batch.test.ts: 100+100 win-rate proof
  #   - swarm-throughput.test.ts: 1,000 sequential runs
  # ---------------------------------------------------------------
  full-statistical-proofs:
    name: Full Statistical + Perf Proofs
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run full-size statistical and perf proof suites
        run: >-
          npx jest --selectProjects unit --ci --runInBand --runTestsByPath
          src/simulation/__tests__/simulation.test.ts
          src/simulation/__tests__/integration.test.ts
          src/simulation/__tests__/simulation-combat-integration.test.ts
          src/simulation/__tests__/swarm-pilot-skills-batch.test.ts
          src/simulation/__tests__/swarm-throughput.test.ts
          src/lib/multiplayer/server/__tests__/fogOfWar.test.ts
          src/lib/multiplayer/server/__tests__/campaignHostIntentServerTime.test.ts
          src/lib/multiplayer/server/__tests__/MatchStoreStress.test.ts
          src/__tests__/performance.test.tsx
        env:
          # E-2: force the perfIt wall-clock budget tests to execute in
          # CI. Without this lane the perf assertions ran nowhere: unit
          # shards skip them via JEST_EXCLUDE_PERF_SENSITIVE and the PR
          # perf-smoke lane does not include simulation.test.ts.
          SIMULATION_PERF_ASSERTIONS: 'true'
          # E-6: the spec'd throughput scale (quick-session spec,
          # "Throughput target met for 1,000 runs"). The run COUNT is
          # the proof shape and stays at the spec'd 1,000; set
          # explicitly so the proof stays pinned even if defaults
          # drift. The 60s wall-clock budget is spec'd for "a developer
          # machine (M1 / Ryzen-class CPU)" — measured 2026-06-10 at
          # 54.76 ms/run (54.8s total) on an idle dev box, i.e. ~9%
          # headroom, which a contended shared CI runner will not have.
          # Budget widened 3x per the repo perf-budget convention; a 3x
          # ceiling still fails loudly on the order-of-magnitude
          # regression class this lane exists to catch.
          SWARM_THROUGHPUT_RUN_COUNT: '1000'
          SWARM_THROUGHPUT_TIME_BUDGET_MS: '180000'
          # Wall-clock budgets for the contended shared CI runner: 3x
          # the local-dev defaults per the repo perf-budget convention
          # (see the 750 -> 2250 widening comment in integration.test.ts).
          # These widen TIME budgets only — batch COUNTS stay at their
          # full defaults, which is what makes the statistical proofs
          # non-vacuous. A 3x budget still fails loudly on
          # order-of-magnitude regressions, which is the class that
          # slipped through unseen (2026-06-09 audit headline).
          SIMULATION_PROFILE_RUNNER_BUDGET_MS: '6750'
          SIMULATION_PROFILE_AVG_GAME_BUDGET_MS: '4500'
          SIMULATION_PROFILE_TIME_BUDGET_MS: '360000'

  # ---------------------------------------------------------------
  # Full Playwright suite on chromium (E-1 remainder). The PR
  # e2e-smoke lane is bounded to ONE spec file for the ~5-minute PR
  # budget; this lane runs the entire e2e/ directory against the
  # self-booted Next dev server (playwright.config.ts webServer).
  #
  # --ignore-snapshots: the committed screenshot baselines are
  # win32-only (e.g. *-chromium-win32.png), so pixel comparisons on a
  # linux runner would fail with "snapshot doesn't exist" rather than
  # catching regressions. The lane proves the functional flows in
  # every spec; pixel-level visual regression remains a local
  # (win32) concern.
  #
  # Three duration-balanced shards, each one worker with its own server
  # and database, as the single job had. run-ci-e2e plans the live census
  # (--grep-invert NIGHTLY_GREP_INVERT in scripts/playwright/ci-e2e-plan.mjs)
  # by config/playwright/nightly-durations.json, keeps files whole, and runs
  # the shard through run-playwright.mjs. The "Full E2E Suite (chromium)"
  # job below summarises the shards under the name the history readers use.
  # ---------------------------------------------------------------
  e2e-full-shard:
    name: Full E2E Shard (chromium, ${{ matrix.shard }}/3)
    needs: install-deps
    runs-on: ubuntu-24.04
    # Single-worker CI setting (playwright.config.ts workers: 1); run-ci-e2e
    # also kills a shard's Playwright tree after 150 minutes.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        id: setup
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          verify-native-modules: 'true'
          # The suite includes the customizer record-sheet specs, which
          # render real mm-data templates/pips. Without the assets on
          # disk those renders fall back to the CDN/GitHub chain, so the
          # lane would prove network availability rather than rendering.
          fetch-assets: 'true'

      - name: Validate record-sheet assets
        run: npm run validate:assets:strict

      - name: Build production app
        env:
          NEXT_PUBLIC_E2E_MODE: 'true'
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: npm run build

      - name: Resolve Playwright version for browser cache key
        id: playwright-version
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.setup.outputs.cache-platform }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        uses: ./.github/actions/playwright-system-deps

      - name: Run full Playwright e2e suite
        env:
          # The authority-recovery and restart packs kill the server on purpose
          # (process-exit-after-commit) and wait for it to come back. Playwright
          # cannot restart a dead webServer, so run the standalone server under
          # the relaunching wrapper the QC plans already use.
          MEKSTATION_E2E_SERVER_COMMAND: 'cd .next/standalone && node ../../scripts/e2e/relaunching-server.mjs'
          HOSTNAME: '127.0.0.1'
          MEKSTATION_E2E_REPLAY_FIXTURE_ROOT: ${{ github.workspace }}/.next/standalone
        # E2E-19 and E2E-25 need the combat-journal fixture arm, which the
        # whole suite must not run under; the census excludes them
        # (NIGHTLY_GREP_INVERT) and shard 1 runs them armed in the next step.
        # The JSON report lands in e2e-timings/nightly.json.
        run: node scripts/playwright/run-ci-e2e.mjs --suite-set nightly --shard=${{ matrix.shard }}/3

      # E2E-19 and E2E-25 (e2e/gm-two-player-privacy.pack.spec.ts) preview a
      # GM rewind, which needs GET /api/matches/:id/head to name a journal
      # head. Production combat-journal authority is off, so without the E2E
      # fixture arm the route answers 404 {"error":"no head"}, no
      # rewind-preview is sent, and both rows time out. This arms exactly
      # those two rows the way scripts/qc/gm-two-player-campaign-core.cjs
      # arms the privacy-pack group ('enabled'; the arm is honoured only with
      # NEXT_PUBLIC_E2E_MODE=true, which the build step above sets).
      # It runs once, on shard 1 only.
      # U24b OBLIGATION: the production combat-journal cutover retires this
      # arm. The PR that lands U24b must delete this step and
      # NIGHTLY_GREP_INVERT in scripts/playwright/ci-e2e-plan.mjs (the
      # census exclusion) in the same change, or this step forwards a key
      # nothing reads. Do not replace this split with a skip guard in the spec.
      - name: Run journal-armed privacy rows (E2E-19, E2E-25)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'cd .next/standalone && node ../../scripts/e2e/relaunching-server.mjs'
          HOSTNAME: '127.0.0.1'
          MEKSTATION_E2E_COMBAT_JOURNAL_AUTHORITY_MODE: 'enabled'
        # CLI --reporter replaces the config's html reporter so this step
        # does not overwrite the full suite's playwright-report, and --output
        # keeps its artifacts out of the full suite's test-results.
        run: node scripts/playwright/run-playwright.mjs test --project=chromium --workers=1 --ignore-snapshots --reporter=github,list --output=test-results-journal-armed e2e/gm-two-player-privacy.pack.spec.ts --grep "@E2E-19|@E2E-25"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-playwright-report-${{ matrix.shard }}
          path: |
            playwright-report-nightly
            test-results
            test-results-journal-armed
          retention-days: 7

      # The executed-test JSON feeds the summary's union check and later
      # duration reseeds (record-ci-e2e-durations.mjs --suite-set nightly).
      - name: Upload executed-test report and plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-timings-${{ matrix.shard }}
          path: e2e-timings
          retention-days: 7

  # ---------------------------------------------------------------
  # Summary of the shards under the job name D-11 and the history readers
  # use. Runs after every shard, whatever their outcome. Fails unless the
  # whole matrix succeeded (cancelled or skipped fail too) and the shards'
  # executed tests equal a fresh census of this head exactly. Retry-only
  # passes are printed as named observations.
  # ---------------------------------------------------------------
  e2e-full:
    name: Full E2E Suite (chromium)
    needs: e2e-full-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          build-caches: 'false'

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-e2e-timings-*
          path: e2e-shards

      # Runs even when no shard uploaded anything, so the reasons print.
      - name: Check shards, census union and retries
        if: ${{ !cancelled() }}
        env:
          NIGHTLY_SHARD_RESULT: ${{ needs.e2e-full-shard.result }}
        run: node scripts/playwright/summarize-nightly-shards.mjs 3 e2e-shards

  # ---------------------------------------------------------------
  # Coverage thresholds (E-9). jest.config.js has carried
  # coverageThreshold values since 2026-04-25, but no CI lane ever ran
  # with --coverage, so the ratchet never actually gated anything.
  #
  # JEST_EXCLUDE_PERF_SENSITIVE=true matches the PR unit-shard test
  # surface: the four full-size statistical suites are excluded here
  # because (a) they run for real in full-statistical-proofs above and
  # (b) coverage instrumentation distorts their wall-clock budgets.
  # The thresholds in jest.config.js are calibrated against exactly
  # this surface.
  # ---------------------------------------------------------------
  coverage:
    name: Coverage Thresholds
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run unit tests with coverage thresholds
        run: npx jest --selectProjects unit --ci --coverage
        env:
          JEST_EXCLUDE_PERF_SENSITIVE: 'true'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  # ---------------------------------------------------------------
  # Scenario-pack drift recapture (add-scenario-packs, ladder W4, task
  # 6.2; design D7 layer 4 / spec: "Version Pinning and CI Drift
  # Recapture"). For every registered scenario pack: re-validates the
  # committed payload against the current pack schemas and version
  # pins, re-mints it from its recorded genesis source (a flow
  # checkpoint replayed on chromium, a fast-forward fixture re-run in
  # jest, or the combat anchor journey replayed on chromium), and
  # compares the fresh mint against the committed payload at the
  # INVARIANT level (never byte-structural — production mints
  # wall-clock ids/dates and a random RNG seed on every capture, so
  # structural equality is unachievable by construction; design D7).
  #
  # Triage-only, NEVER a pull-request gate (design: non-goal "packs
  # gate nothing until parity-proven" + "NO PR-gate or required-check
  # wiring"): this job exists ONLY here, appended to
  # notify-on-failure's needs below so drift lands on the existing
  # tracking-issue convention. It is deliberately absent from
  # pr-checks.yml and carries no `required` branch-protection status.
  #
  # Needs the chromium browser (flow-checkpoint + anchor-captured
  # re-mints drive a live Playwright journey against the self-booted
  # production standalone server, mirroring e2e-full's own browser-cache steps
  # above) plus a full node_modules install (fast-forward re-mints run
  # via jest, headless, no browser).
  # ---------------------------------------------------------------
  scenario-pack-recapture:
    name: Scenario Pack Recapture
    needs: install-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        id: setup
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          verify-native-modules: 'true'

      - name: Resolve Playwright version for browser cache key
        id: playwright-version
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.setup.outputs.cache-platform }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        uses: ./.github/actions/playwright-system-deps

      - name: Build production app for recapture
        env:
          NEXT_PUBLIC_E2E_MODE: 'true'
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: npm run build

      - name: Re-mint every registered scenario pack and diff at the invariant level
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'cd .next/standalone && node ../../scripts/e2e/relaunching-server.mjs'
          HOSTNAME: '127.0.0.1'
        run: node scripts/qc/recapture-scenario-packs.mjs

      - name: Upload scenario pack recapture diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-scenario-pack-recapture
          path: .sisyphus/scenario-pack-recapture
          include-hidden-files: true
          retention-days: 7

  # ---------------------------------------------------------------
  # Per-subsystem nightly audit lanes (W6 design D8): one matrix leg
  # per tenanted @subsystem: tag, selecting specs by native tag grep.
  # fail-fast disabled so one red lane never hides another. NOT
  # referenced by any PR workflow or required check — nightly-only.
  # The matrix list is cross-checked against the coverage ledger by
  # scripts/qc/validate-subsystem-coverage.mjs (both directions).
  # ---------------------------------------------------------------
  subsystem-lanes:
    name: Subsystem Lane (${{ matrix.subsystem }})
    needs: install-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        subsystem: [economy, personnel, experience, navigation, combat, maintenance]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        id: setup
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          verify-native-modules: 'true'

      - name: Resolve Playwright version for browser cache key
        id: playwright-version
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.setup.outputs.cache-platform }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        uses: ./.github/actions/playwright-system-deps

      - name: Run the subsystem lane
        run: npx playwright test --grep "@subsystem:${{ matrix.subsystem }}" --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: subsystem-lane-${{ matrix.subsystem }}-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ---------------------------------------------------------------
  # Per-unit runtime parity, independent measures so one failure cannot hide
  # the other's report. Counts and the previous-nightly SHA range are
  # informational. The called gate owns enforcement: the committed baseline,
  # tightened by the last green main Nightly while that baseline is unchanged.
  parity-runtime:
    strategy:
      fail-fast: false
      matrix:
        measure: [load, reopen]
    uses: ./.github/workflows/parity-runtime.yml
    with:
      measure: ${{ matrix.measure }}
    permissions:
      contents: read
      actions: read

  # ---------------------------------------------------------------
  # Failure notification: a red nightly run must not scroll away
  # unseen in the Actions tab (that silence is exactly how the
  # 2026-06-09 audit findings accumulated). Opens a tracking issue on
  # first failure and comments on the existing one for repeats.
  #
  # Main only: the issue tracks main's nightly. A workflow_dispatch on a
  # PR branch (full E2E before merge) still runs and fails every lane
  # normally, but must not report its failure as main's.
  # ---------------------------------------------------------------
  notify-on-failure:
    name: Notify on Failure
    needs:
      [
        full-statistical-proofs,
        e2e-full,
        coverage,
        scenario-pack-recapture,
        subsystem-lanes,
        parity-runtime,
      ]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open or update nightly-validation failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly validation failed"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Nightly validation failed again: $RUN_URL"
            echo "Commented on existing issue #$existing"
          else
            gh issue create --title "$title" --body "$(printf 'The scheduled nightly validation run failed.\n\nRun: %s\n\nLanes: full statistical/perf proofs, full Playwright e2e (chromium), coverage thresholds, scenario-pack recapture, subsystem lanes, runtime parity (load and reopen). See docs/audits/2026-06-09-remediation-tracker.md (W4.4) for what each lane enforces.' "$RUN_URL")"
            echo "Opened new failure issue"
          fi
