name: CI Budget Reconciliation

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

# No publisher queue: overlapping runs independently use head-bound
# write-then-verify, just like the event-driven budget publishers.
jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { reconcileBudgetStatuses } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/budget-reconcile.mjs`);
            await reconcileBudgetStatuses({ github, ...context.repo, runNumber: context.runNumber, core });
