name: CI Budget Reconciliation

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

# Runs are serialized: a manual dispatch or a delayed cron run waits for the
# running sweep, so one run cannot overwrite another's write and turn that
# run's readback red. A replaced pending run is harmless; the next sweep
# covers its bucket.
concurrency:
  group: ci-budget-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { reconcileBudgetStatuses } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/budget-reconcile.mjs`);
            await reconcileBudgetStatuses({ github, ...context.repo, runNumber: context.runNumber, core });
