name: Parity Runtime

# Runtime-path parity gate: per-unit facts computed from the app's loaded state,
# compared against the committed baseline. Census counts and the SHA range are
# informational; gate.mjs owns the pass/fail decision. Last green is not
# informational: while the committed baseline is unchanged, the gate takes the
# best of each fact against the last green main Nightly, so it changes what fails.
#
# Dispatch remains available so a runtime port can prove on its own branch that
# the hosted per-unit table equals the local one (gh workflow run
# parity-runtime.yml --ref <branch> -f measure=load). Each port supplies its
# entry script; on a ref without it the job fails and says so. Nightly
# Validation calls this workflow for both measures. Never add a PR or
# push trigger. Branch dispatches are logged in the C5 queue notes, one in
# flight per measure; they are not charged against the nightly dispatch slots.
# Hosted census wall times: load 210-242 s, reopen 331-499 s. The 15/20-minute
# limits allow installation, optional artifact retrieval and reporting headroom.
on:
  workflow_dispatch:
    inputs:
      measure:
        description: Runtime measure to census
        required: true
        type: choice
        options: [load, reopen]
  workflow_call:
    inputs:
      measure:
        required: true
        type: string

concurrency:
  group: parity-runtime-${{ inputs.measure }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  census:
    name: Parity Runtime ${{ inputs.measure }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.measure == 'load' && 15 || 20 }}
    steps:
      - name: Set runner scratch path
        run: printf 'PARITY_RUNTIME_OUTPUT=%s/parity-runtime\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The gate checks the committed baseline SHA's ancestry.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run runtime census
        env:
          MEASURE: ${{ inputs.measure }}
        run: |
          case "$MEASURE" in
            load) entry=scripts/runtime-path-bv/run.mjs ;;
            reopen) entry=scripts/runtime-roundtrip/run.mjs ;;
            *) echo "::error::unknown measure '$MEASURE'"; exit 2 ;;
          esac
          if [ ! -f "$entry" ]; then
            echo "::error::$entry is not on this ref. Dispatch the branch that carries the port (--ref)."
            exit 1
          fi
          mkdir -p "$PARITY_RUNTIME_OUTPUT"
          start=$(date -u +%s)
          status=0
          node "$entry" --out "$PARITY_RUNTIME_OUTPUT" || status=$?
          end=$(date -u +%s)
          # What the ports' acceptance compares against the local run: the
          # checked-out SHA, Node version and runner image, written even when
          # the census fails.
          printf '{"measure":"%s","entry":"%s","sha":"%s","node":"%s","runnerImage":"%s %s","runnerArch":"%s","wallSeconds":%s,"exitCode":%s}\n' \
            "$MEASURE" "$entry" "$(git rev-parse HEAD)" "$(node --version)" \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_ARCH" \
            "$((end - start))" "$status" \
            > "$PARITY_RUNTIME_OUTPUT/run-meta.json"
          echo "census $MEASURE: exit $status, wall time $((end - start)) s, node $(node --version), image ${ImageOS:-unknown} ${ImageVersion:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Retrieve last green from main Nightly
        id: last-green
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MEASURE: ${{ inputs.measure }}
        run: node scripts/ci/parity-runtime-last-green.mjs --measure "$MEASURE" --out "$PARITY_RUNTIME_OUTPUT/previous"

      - name: Gate runtime parity
        id: gate
        if: ${{ !cancelled() }}
        env:
          MEASURE: ${{ inputs.measure }}
        run: |
          args=()
          if [ -f "$PARITY_RUNTIME_OUTPUT/previous/last-green.json" ]; then
            args+=(--last-green "$PARITY_RUNTIME_OUTPUT/previous/last-green.json")
          fi
          node scripts/lib/runtime-parity/gate.mjs --measure "$MEASURE" --run-dir "$PARITY_RUNTIME_OUTPUT" "${args[@]}"

      - name: Summarize runtime gate
        if: ${{ !cancelled() }}
        run: node scripts/ci/parity-runtime-summary.mjs --run-dir "$PARITY_RUNTIME_OUTPUT"

      - name: Upload census output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: parity-runtime-${{ inputs.measure }}
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          # Includes census files and gate/{gate-report.json,gate-units.ndjson,
          # proposed-baseline.json}, even when the gate fails.
          path: ${{ runner.temp }}/parity-runtime/

      # Only after a lookup that completed (status found or none; the list is
      # LAST_GREEN_UPLOAD_STATUSES in parity-runtime-last-green.mjs). After a
      # failed lookup the gate ran on the committed baseline alone, and uploading
      # that untightened result would replace the chain. A missing output (the
      # lookup step died first) also blocks the upload.
      - name: Upload last green
        if: ${{ success() && steps.gate.outcome == 'success' && (steps.last-green.outputs.status == 'found' || steps.last-green.outputs.status == 'none') }}
        uses: actions/upload-artifact@v7
        with:
          name: parity-runtime-last-green-${{ inputs.measure }}
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/parity-runtime/gate/last-green.json
