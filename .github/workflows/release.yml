name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual triggering
    inputs:
      release_tag:
        description: 'Tag to release (defaults to latest v*)'
        required: false
        type: string
      candidate_only:
        description: 'Build private candidate artifacts without publication'
        type: boolean
        default: false
      qualification_run_id:
        description: 'Actions run holding v220-qualified bundle for this exact candidate'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-context:
    name: Determine release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      ref: ${{ steps.resolve_tag.outputs.ref }}
      prev_tag: ${{ steps.resolve_tag.outputs.prev_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve_tag
        env:
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --tags

          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # sed -n 1p (not head -n 1): head closes the pipe early and git
            # dies with SIGPIPE under `set -euo pipefail` (exit 141), which
            # caused historical release-context failures.
            TAG=$(git tag -l 'v*' --sort=-version:refname | sed -n 1p)
          fi

          if [ -z "$TAG" ]; then
            echo "No release tag found" >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null

          # Pick the next older version, including when retrying an older tag.
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | awk -v tag="$TAG" '$0 == tag { found = 1; next } found && !printed { print; printed = 1 }')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Release tag: ${{ steps.resolve_tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous tag: ${{ steps.resolve_tag.outputs.prev_tag }}" >> "$GITHUB_STEP_SUMMARY"

  prepare-build:
    name: Prepare Build Artifacts
    needs: release-context
    runs-on: ubuntu-latest
    if: startsWith(needs.release-context.outputs.tag, 'v')
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-context.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: |
            node_modules
            desktop/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('package-lock.json', 'desktop/package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install desktop dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci

      - name: Cache mm-data assets
        uses: actions/cache@v5
        id: mm-data-cache
        with:
          path: public/record-sheets
          key: mm-data-assets-${{ hashFiles('config/mm-data-assets.json') }}
          restore-keys: |
            mm-data-assets-

      - name: Fetch mm-data assets
        if: steps.mm-data-cache.outputs.cache-hit != 'true'
        run: npm run fetch:assets

      - name: Validate assets
        run: npm run validate:assets:strict

      - name: Build Next.js application
        run: npm run build

      - name: Build Electron TypeScript
        working-directory: desktop
        run: npm run build

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          # Next.js output and its nested .next directories are hidden.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next/standalone
            .next/static
            desktop/dist
            public/record-sheets
          retention-days: 1

  build:
    needs: [release-context, prepare-build]
    runs-on: ${{ matrix.os }}
    if: startsWith(needs.release-context.outputs.tag, 'v')
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-15
            platform: mac-arm64
            mac_arch: arm64
          # Native rebuilds use process.arch, so each Mac needs a matching host.
          - os: macos-15-intel
            platform: mac-x64
            mac_arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-context.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set app version from tag
        shell: bash
        run: |
          APP_VERSION="${{ needs.release-context.outputs.tag }}"
          APP_VERSION="${APP_VERSION#v}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: |
            node_modules
            desktop/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('package-lock.json', 'desktop/package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install desktop dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-build

      - name: Restore artifact structure
        shell: bash
        run: |
          # Verify the artifacts are in place
          test -d .next/standalone || { echo "Missing .next/standalone"; exit 1; }
          test -d .next/static || { echo "Missing .next/static"; exit 1; }
          test -d desktop/dist || { echo "Missing desktop/dist"; exit 1; }
          test -d public/record-sheets || { echo "Missing public/record-sheets"; exit 1; }
          test -f public/record-sheets/mm-data-version.json || { echo "Missing mm-data-version.json"; exit 1; }

      - name: Rebuild native modules for platform
        working-directory: desktop
        shell: bash
        run: npm run rebuild:next-standalone

      - name: Build Electron application (Linux)
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: npx electron-builder --linux --config.extraMetadata.version="$APP_VERSION" --publish never

      - name: Build Electron application (Windows)
        if: matrix.platform == 'win'
        working-directory: desktop
        shell: bash
        # The standalone native payload is rebuilt for this x64 runner only.
        run: npx electron-builder --win nsis portable --x64 --config.extraMetadata.version="$APP_VERSION" --publish never

      - name: Build Electron application (macOS)
        if: startsWith(matrix.platform, 'mac')
        working-directory: desktop
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.mac_arch }}
        run: npx electron-builder --mac dmg zip --${{ matrix.mac_arch }} --config.extraMetadata.version="$APP_VERSION" --publish never

      - name: Prepare release artifacts
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-upload
          mkdir -p release-upload

          # Find and copy release artifacts using find (cross-platform compatible)
          find release -maxdepth 1 -type f ! -name "builder-debug.yml" \( \
            -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.zip" \
            -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.tar.gz" -o -name "*.yml" -o -name "*.blockmap" \
          \) -exec cp -v {} release-upload/ \;

          # Disambiguate mac update manifests so arm/x64 don't collide
          if [[ "${{ matrix.platform }}" == mac* && -f release-upload/latest-mac.yml ]]; then
            mv release-upload/latest-mac.yml "release-upload/latest-mac-${{ matrix.mac_arch }}.yml"
          fi

          # Check if any files were copied
          if [ -z "$(ls -A release-upload 2>/dev/null)" ]; then
            echo "No release artifacts found in desktop/release" >&2
            ls -R release || true
            exit 1
          fi

      - name: Validate installer inventory
        working-directory: desktop
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MAC_ARCH: ${{ matrix.mac_arch }}
        run: |
          set -euo pipefail
          require_artifact() {
            local pattern="$1" file
            for file in release-upload/$pattern; do
              if [ -s "$file" ]; then return 0; fi
            done
            echo "Missing or empty installer: $pattern" >&2
            exit 1
          }
          case "$PLATFORM" in
            linux)
              require_artifact '*.AppImage'
              require_artifact '*.deb'
              require_artifact '*.tar.gz'
              ;;
            win)
              require_artifact "MekStation-${APP_VERSION}-win-x64.exe"
              require_artifact "MekStation-${APP_VERSION}-portable.exe"
              ;;
            mac-*)
              require_artifact "MekStation-${APP_VERSION}-mac-${MAC_ARCH}.dmg"
              require_artifact "MekStation-${APP_VERSION}-mac-${MAC_ARCH}.zip"
              ;;
          esac

      - name: Validate update manifest assets
        working-directory: desktop
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { parse } = require('yaml');
          const directory = 'release-upload';
          for (const name of fs.readdirSync(directory).filter(name => /^latest.*\.yml$/.test(name))) {
            const manifest = parse(fs.readFileSync(path.join(directory, name), 'utf8'));
            const assets = [
              ...(manifest.files || []).map(file => file.url),
              manifest.path,
              ...Object.values(manifest.packages || {}).map(pkg => pkg.path),
            ].filter(Boolean);
            if (!assets.length) throw new Error(`${name}: no referenced assets`);
            for (const asset of assets) {
              const file = path.join(directory, decodeURIComponent(asset));
              if (!fs.existsSync(file) || !fs.statSync(file).isFile() || !fs.statSync(file).size) {
                throw new Error(`${name}: missing or empty asset ${asset}`);
              }
            }
          }
          NODE

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: error
          path: |
            desktop/release-upload/*
          retention-days: 30

  docker-build:
    name: Build Docker image
    needs: release-context
    runs-on: ubuntu-latest
    if: startsWith(needs.release-context.outputs.tag, 'v')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-context.outputs.ref }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/mekstation
            docker.io/anaklumos/mekstation
          tags: |
            type=raw,value=${{ needs.release-context.outputs.tag }}
            type=raw,value=latest

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    name: Push Docker image
    needs: [release-context, build, docker-build]
    environment: release
    runs-on: ubuntu-latest
    # v2.2 installers are promoted byte-for-byte; unqualified container rebuilds cannot publish.
    if: startsWith(needs.release-context.outputs.tag, 'v') && !startsWith(needs.release-context.outputs.tag, 'v2.2.') && !inputs.candidate_only
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-context.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: anaklumos
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/mekstation
            docker.io/anaklumos/mekstation
          tags: |
            type=raw,value=${{ needs.release-context.outputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    # Container publication must not block the installer release.
    needs: [release-context, build]
    environment: release
    runs-on: ubuntu-latest
    if: startsWith(needs.release-context.outputs.tag, 'v') && !inputs.candidate_only
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-context.outputs.ref }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Download release artifacts
        if: ${{ !startsWith(needs.release-context.outputs.tag, 'v2.2.') }}
        uses: actions/download-artifact@v8
        with:
          pattern: '*-artifacts'
          path: artifacts
          merge-multiple: true

      - name: Require external qualification for v2.2 publication
        if: startsWith(needs.release-context.outputs.tag, 'v2.2.')
        env:
          QUALIFICATION_RUN: ${{ inputs.qualification_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$QUALIFICATION_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" --jq '"\(.head_sha) \(.head_repository.full_name) \(.conclusion)"' | grep -Fx "$(git rev-parse HEAD) $GITHUB_REPOSITORY success"

      - name: Download rehearsed v2.2 artifacts and evidence
        if: startsWith(needs.release-context.outputs.tag, 'v2.2.')
        uses: actions/download-artifact@v8
        with:
          name: v220-qualified
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qualification

      - name: Generate commit list
        id: commits
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ needs.release-context.outputs.tag }}"
          PREV_TAG="${{ needs.release-context.outputs.prev_tag }}"

          # Ensure current tag exists
          if ! git rev-parse --verify "refs/tags/${CURRENT_TAG}^{commit}" >/dev/null 2>&1; then
            echo "Tag ${CURRENT_TAG} not found. Ensure it is pushed before releasing." >&2
            exit 1
          fi

          # If previous tag is missing or not found, treat as initial release
          if [ -n "$PREV_TAG" ] && ! git rev-parse --verify "refs/tags/${PREV_TAG}^{commit}" >/dev/null 2>&1; then
            echo "Previous tag ${PREV_TAG} not found; treating as initial release." >&2
            PREV_TAG=""
          fi

          if [ -z "$PREV_TAG" ]; then
            # No previous tag - this is the initial release
            echo "Initial release - listing latest 100 commits up to $CURRENT_TAG"
            git log -100 "$CURRENT_TAG" --pretty=format:"- %s (%h)" > commits.md
          else
            # Bound the commit list to leave room in the release body.
            echo "Generating commits from $PREV_TAG to $CURRENT_TAG"
            git log -100 "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" > commits.md
          fi

          # Check if we have any commits
          if [ ! -s commits.md ]; then
            echo "- No commits in this release" > commits.md
          fi

      - name: Generate release notes with Docker links
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.release-context.outputs.tag }}
          PREV_TAG: ${{ needs.release-context.outputs.prev_tag }}
        run: |
          set -euo pipefail
          args=(-f "tag_name=$CURRENT_TAG")
          if [ -n "$PREV_TAG" ]; then
            args+=(-f "previous_tag_name=$PREV_TAG")
            HISTORY_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          else
            HISTORY_URL="https://github.com/${{ github.repository }}/commits/${CURRENT_TAG}"
          fi
          gh api repos/${{ github.repository }}/releases/generate-notes "${args[@]}" > notes.json
          # Leave room below GitHub's 125k body limit for the commit appendix.
          body=$(jq -r '.body[:50000]' notes.json)
          {
            echo "$body"
            echo ""
            echo "Generated notes are limited to 50,000 characters; full history is linked below."
            echo "---"
            echo "Full history: $HISTORY_URL"
            echo ""
            echo "## Latest 100 commits in this release"
            echo ""
            cat commits.md
            echo ""
            echo "---"
            echo "## Docker images"
            echo "Built and published separately; check the Docker jobs for this tag before pulling."
            echo "- Docker Hub: https://hub.docker.com/r/anaklumos/mekstation"
            echo "- GHCR: https://ghcr.io/${{ github.repository_owner }}/mekstation"
          } > release-notes.md
          echo "body_path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Refuse unqualified v2.2 publication on the tagged commit
        if: startsWith(needs.release-context.outputs.tag, 'v2.2.')
        run: |
          RC="$(git rev-parse HEAD)"
          node scripts/qc/generate-v220-steps.mjs --gate-check --candidate-sha "$RC" \
            --evidence qualification/evidence.json --artifacts qualification/artifacts | grep -Fx "V2.2 GATE PASSED $RC"
          cp qualification/release-notes.md release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          files: ${{ startsWith(needs.release-context.outputs.tag, 'v2.2.') && 'qualification/artifacts/*' || 'artifacts/**/*' }}
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
