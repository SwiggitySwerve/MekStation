name: CI Budget Approval

on:
  pull_request_target:
    branches: [main]
    paths: ['config/ci/budgets.json', 'package.json', 'package-lock.json', 'desktop/package.json', 'desktop/package-lock.json']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [CI Budget Review Signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to reevaluate
        required: true
        type: number

permissions: {}

jobs:
  approval:
    concurrency:
      # A late signal for an old SHA cannot replace a new SHA's pending revocation.
      # Dispatch has no head SHA at expression time; its recovery queue is separate.
      group: ci-budget-publish-${{ github.repository }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || format('dispatch-pr-{0}', inputs.pull_request) }}
      cancel-in-progress: false
    # Manual dispatch cannot grant write privileges to arbitrary branch code.
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          REQUESTED_PR: ${{ inputs.pull_request }}
        with:
          script: |
            // Statuses go only to the head this run evaluated. Label changes
            // are handled by the separate, unfiltered label workflow.
            const { checkBudgetPolicy, guardOutcome } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/budget-approval.mjs`);
            // Every evaluation is bound to the head this run is for (expectedHead):
            // the event's PR head, the reviewed head for a review signal, or the
            // live head read once at dispatch. A PR that has moved past it gets
            // no write from this run; its new head is evaluated by its own run.
            const { owner, repo } = context.repo;
            let targets;
            if (context.eventName === 'workflow_run') {
              // The signal supplies no data or code. GitHub's commit association
              // selects candidates; the adapter rereads current PR heads/reviews.
              const signal = context.payload.workflow_run;
              if (signal.event !== 'pull_request_review') throw new Error('Unexpected review signal event');
              const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner, repo, commit_sha: signal.head_sha, per_page: 100,
              });
              targets = associated.filter(pr => pr.state === 'open' && pr.base.repo.full_name === context.payload.repository.full_name).map(pr => ({ number: pr.number, head: signal.head_sha }));
            } else if (context.payload.pull_request) {
              targets = [{ number: context.payload.pull_request.number, head: context.payload.pull_request.head.sha }];
            } else {
              const number = Number(process.env.REQUESTED_PR);
              if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              targets = [{ number, head: pr.head.sha }];
            }
            if (targets.some(({ number }) => !Number.isSafeInteger(number) || number < 1)) throw new Error('Invalid PR number');
            const seen = new Set();
            for (const { number, head } of targets) {
              if (seen.has(number)) continue;
              seen.add(number);
              const result = await checkBudgetPolicy({ github, owner, repo, number, expectedHead: head });
              const outcome = guardOutcome(number, result);
              core.info(outcome.line);
              core.info(JSON.stringify({ number, ...result }));
              if (outcome.fail) core.setFailed(outcome.line);
            }
