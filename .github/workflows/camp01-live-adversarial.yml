name: CAMP-01 Live Adversarial Evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict-skips:
        description: 'Fail the run when a probe skips on a host whose capability the workflow provisions'
        type: boolean
        default: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  publish-live-evidence:
    name: Publish Live Evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps
      - name: Run live adversarial probes
        run: npm run qc:camp01-live-adversarial -- --artifact "artifacts/camp01-live-adversarial/${{ runner.os }}.json" ${{ inputs.strict-skips == true && '--strict-skips' || '' }}
      # The tier stays an evidence publisher, so an unexpected skip is surfaced as a warning
      # annotation and a job summary line rather than a red run. Dispatch with strict-skips
      # to make the same signal fail instead.
      - name: Surface live adversarial skip disposition
        if: always()
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), artifactPath = process.argv[1];
            if (!fs.existsSync(artifactPath)) console.log(`::warning::${artifactPath} was never published`);
            else {
              const summary = JSON.parse(fs.readFileSync(artifactPath, "utf8")).summary;
              console.log(JSON.stringify(summary));
              if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- \`${artifactPath}\`: ${JSON.stringify(summary)}\n`);
              if (summary.skippedUnexpectedly > 0) console.log(`::warning::CAMP-01 live adversarial lost ${summary.skippedUnexpectedly} provisioned capability probe(s): ${summary.unexpectedSkips.join(", ")}`);
            }
          ' "artifacts/camp01-live-adversarial/${{ runner.os }}.json"
      - name: Upload live adversarial artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camp01-live-adversarial-${{ runner.os }}
          path: artifacts/camp01-live-adversarial/${{ runner.os }}.json
          if-no-files-found: error

  # The matrix legs publish evidence; this job is the only thing that READS it.
  # A per-leg step cannot see the other leg, cannot see a leg that died before
  # uploading, and treats an unexpected skip as a warning on an otherwise green
  # leg. This job reconciles both legs into one verdict and fails when the tier
  # is not clean, so the run itself goes red on the Actions tab instead of the
  # red depending on someone remembering to look. It has no `pull_request`
  # trigger and is not a required status context, so it cannot block a merge.
  live-tier-signal:
    name: Live Tier Signal
    needs: publish-live-evidence
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only, deliberately. This job reports; it never writes to the repo.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # A leg that died before publishing must still be assessed as missing, so
      # a download that finds nothing may not abort the job.
      - name: Download live adversarial artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts/camp01-live-signal
          pattern: camp01-live-adversarial-*
      - name: Assess both live adversarial legs
        run: >-
          node scripts/qc/camp01-live-signal.mjs
          --artifacts artifacts/camp01-live-signal
          --expect Linux,Windows
