# NEVER MERGE: registered workflow path reused for a bounded matched diagnostic.
# No pull_request/push/schedule trigger. A alone submits after Root routing.
name: Renderer teardown diagnostic
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Sequential shard count; same committed head for both arms
        required: true
        type: choice
        options: ['2', '3']
        default: '2'
permissions:
  contents: read
concurrency:
  group: renderer-teardown-diagnostic
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  e2e:
    name: E2E (${{ matrix.shard }}/${{ inputs.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '3' && '[1,2,3]' || '[1,2]') }}
    env:
      MEKSTATION_E2E_MEMORY_ROOT: ${{ github.workspace }}/renderer-memory
      MEKSTATION_E2E_MEMORY_SHARDS: ${{ inputs.shards }}
      MEKSTATION_E2E_MEMORY_SHARD_INDEX: ${{ matrix.shard }}
      MEKSTATION_E2E_SERVER_COMMAND: node .next/standalone/server.js
      HOSTNAME: '127.0.0.1'
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node and existing caches
        id: install
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'
      - name: Test diagnostic helpers and failure contracts
        run: timeout 120s node --test scripts/playwright/renderer-memory*.test.mjs scripts/playwright/ci-e2e-plan.test.mjs
      - name: Record exact source and runner
        env:
          MODULE_CACHE_HIT: ${{ steps.install.outputs.node-modules-cache-hit }}
        run: |
          mkdir -p renderer-memory
          git rev-parse HEAD > renderer-memory/head.txt
          node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,cpus:require("os").cpus().length,runner:process.env.ImageVersion,cache:process.env.MODULE_CACHE_HIT,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,shards:process.env.MEKSTATION_E2E_MEMORY_SHARDS}))' > renderer-memory/runner.json
          sha256sum package-lock.json config/playwright/ci-durations.json > renderer-memory/inputs.sha256
      - name: Validate assets
        run: timeout 120s npm run validate:assets:strict
      - name: Build production harness on this runner
        env:
          NEXT_PUBLIC_E2E_MODE: 'true'
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: timeout 300s npm run build
      - name: Resolve browser cache key
        id: browser-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore installed browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.browser-version.outputs.version }}
      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: timeout 180s npx playwright install --with-deps chromium
      - name: Install cached browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: timeout 180s npx playwright install-deps chromium
      - name: Prepare argv-preserving kernel RSS wrapper
        run: node scripts/playwright/renderer-memory-browser.mjs
      - name: Run gates
        if: ${{ !cancelled() }}
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/active-session-recovery.spec.ts e2e/seam-roster-materialization-handoff.spec.ts e2e/seam-fresh-construction-no-instant-defeat.spec.ts e2e/customizer-equipment-catalog.spec.ts e2e/customizer-record-sheet-rendering.spec.ts e2e/customizer-edit-recovery.spec.ts --project=chromium --retries=0 --trace=retain-on-failure --workers=1 --shard=${{ matrix.shard }}/${{ inputs.shards }} --output=test-results/gates
      - name: Run library
        if: ${{ !cancelled() }}
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/customizer-library-open.spec.ts --project=chromium --workers=1 --shard=${{ matrix.shard }}/${{ inputs.shards }} --output=test-results/library
      - name: Run smoke
        if: ${{ !cancelled() }}
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/tactical-map-visual-smoke.spec.ts --project=chromium --workers=4 --shard=${{ matrix.shard }}/${{ inputs.shards }} --output=test-results/smoke
      - name: Assert executed census and renderer observability
        if: ${{ !cancelled() }}
        run: node scripts/playwright/renderer-memory-verify.mjs
      - name: Archive every diagnostic observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-diagnostic-${{ inputs.shards }}-${{ matrix.shard }}
          path: |
            renderer-memory
            e2e-timings
            test-results
            playwright-report-gates
            playwright-report-library
            playwright-report-smoke
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  lint-and-test:
    name: Lint and Test
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Preserve every required first-attempt failure
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --input-type=module -e 'import {assertJobResults} from "./scripts/ci/budget-aggregate.mjs"; assertJobResults(["e2e"],{},JSON.parse(process.env.NEEDS_JSON))'
      - name: Download all shard observations
        uses: actions/download-artifact@v8
        with:
          pattern: renderer-diagnostic-*
          path: diagnostic-union
      - name: Assert executed union equals the full live census
        env:
          MEKSTATION_E2E_MEMORY_SHARDS: ${{ inputs.shards }}
        run: node scripts/playwright/renderer-memory-union.mjs diagnostic-union
