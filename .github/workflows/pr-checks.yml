# NEVER MERGE: one Root-routed, single-job G6-042 capture on a frozen draft head.
name: DO NOT MERGE G6-042 causal-state capture
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g6-042-causal-state
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  capture:
    name: G6-042 single capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MEKSTATION_G6_042: '1'
      MEKSTATION_G6_042_ROOT: ${{ github.workspace }}/g6-042-capture
      MEKSTATION_G6_042_SUITE: gates
      MEKSTATION_E2E_SERVER_COMMAND: node .next/standalone/server.js
      HOSTNAME: '127.0.0.1'
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - name: Install existing pinned dependencies and assets
        id: install
        uses: SwiggitySwerve/MekStation/.github/actions/setup-node-and-install@8a8f1b3f8fcb8305a8aa12c85d9b7636cb4d0247
        with:
          node-version: '22'
          fetch-assets: 'true'
          verify-native-modules: 'true'
      - name: Test diagnostic guards before browser work
        run: timeout 120s node --test scripts/playwright/g6-042-state.test.mjs scripts/playwright/ci-e2e-plan.test.mjs
      - name: Record frozen source and runner
        env:
          MODULE_CACHE_HIT: ${{ steps.install.outputs.node-modules-cache-hit }}
        run: |
          mkdir -p g6-042-capture
          git rev-parse HEAD > g6-042-capture/head.txt
          node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,cpus:require("os").cpus().length,runner:process.env.ImageVersion,moduleCache:process.env.MODULE_CACHE_HIT,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.GITHUB_JOB}))' > g6-042-capture/runner.json
          sha256sum package-lock.json config/playwright/ci-durations.json > g6-042-capture/inputs.sha256
      - name: Verify original body, live selection and worker-fixture identity
        run: node scripts/playwright/g6-042-state.mjs contract
      - name: Validate assets
        run: timeout 120s npm run validate:assets:strict
      - name: Build once on this runner
        env:
          NEXT_PUBLIC_E2E_MODE: 'true'
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: timeout 300s npm run build
      - name: Resolve browser cache key
        id: browser-version
        run: |
          version="$(node -e "console.log(require('@playwright/test/package.json').version)")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.install.outputs.cache-platform }}-playwright-${{ steps.browser-version.outputs.version }}
      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: timeout 180s npx playwright install --with-deps chromium
      - name: Install cached browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: timeout 180s npx playwright install-deps chromium
      - name: Prepare unchanged-argv browser-main receipt wrapper
        run: node scripts/playwright/g6-042-state.mjs prepare
      - name: Capture original crash-shard gates once and fail closed
        run: node scripts/playwright/g6-042-state.mjs capture
      - name: Retain complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g6-042-causal-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: g6-042-capture
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
