# SCRATCH ONLY: never merge. Registered filename enables manual branch dispatch.
name: CI-SPEED E2E memory diagnostic (DO NOT MERGE)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-speed-e2e-memory-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MEKSTATION_E2E_DIAGNOSTIC_DIR: ${{ github.workspace }}/e2e-timings/diagnostics
  DEBUG: pw:browser

jobs:
  e2e:
    name: E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'

      - name: Record exact diagnostic checkout and host image
        shell: bash
        run: |
          mkdir -p e2e-timings/diagnostics
          git rev-parse HEAD > e2e-timings/diagnostics/head.txt
          node --version > e2e-timings/diagnostics/node.txt
          cat /etc/os-release > e2e-timings/diagnostics/os-release.txt
          printf '%s\n' "$ImageOS" "$ImageVersion" > e2e-timings/diagnostics/runner-image.txt

      - name: Test E2E shard planning and coverage guards
        run: node --test scripts/playwright/ci-e2e-plan.test.mjs scripts/playwright/ci-diagnostic-observations.test.mjs

      - name: Validate record-sheet assets
        run: npm run validate:assets:strict

      - name: Build production app
        env:
          NEXT_PUBLIC_E2E_MODE: 'true'
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: npm run build

      - name: Resolve Playwright version for browser cache key
        id: playwright-version
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run seam anchor and customizer regression gates
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          # The smoke steps write their own report folders.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-gates
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-timings/gates.json
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/active-session-recovery.spec.ts e2e/seam-roster-materialization-handoff.spec.ts e2e/seam-fresh-construction-no-instant-defeat.spec.ts e2e/customizer-equipment-catalog.spec.ts e2e/customizer-record-sheet-rendering.spec.ts e2e/customizer-edit-recovery.spec.ts --project=chromium --retries=0 --trace=retain-on-failure --workers=1 --shard=${{ matrix.shard }}/2 --output=test-results/gates

      # The library flows save and reopen units through the shared server
      # database, and both viewport variants of a family save the same
      # chassis, so they run on one worker as before (run 41813722683).
      - name: Run customizer library suite
        if: ${{ !cancelled() }}
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-library
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-timings/library.json
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/customizer-library-open.spec.ts --project=chromium --workers=1 --shard=${{ matrix.shard }}/2 --output=test-results/library

      - name: Run tactical-map visual smoke
        if: ${{ !cancelled() }}
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-timings/smoke.json
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/tactical-map-visual-smoke.spec.ts --project=chromium --workers=4 --shard=${{ matrix.shard }}/2 --output=test-results/smoke

      - name: Upload E2E durations and test census
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: e2e-timings
          if-no-files-found: error
          retention-days: 3

      - name: Upload library-open screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-open-screenshots-${{ matrix.shard }}
          path: test-results/library/**/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report
            playwright-report-gates
            playwright-report-library
            playwright-report-smoke
            test-results
          retention-days: 3

  lint-and-test:
    name: Lint and Test
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every diagnostic E2E matrix leg to pass
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: node -e "if (process.env.E2E_RESULT !== 'success') process.exit(1)"
