name: PR Checks

on:
  pull_request:
    branches:
      - main
    # Drafts run on open and every push. Ready keeps the same head's checks;
    # repeating this full graph at that transition only consumes runner time.
    types: [opened, synchronize, reopened]
  # Pushes to main, the nightly schedule and manual runs check everything,
  # including the checks pull requests path-gate or leave to main
  # (scripts/ci/ci-changes.mjs turns every gate on outside pull requests).
  push:
    branches:
      - main
  schedule:
    # Daily at 09:30 UTC, after Nightly Validation starts.
    - cron: '30 9 * * *'
  workflow_dispatch:

# A new push to the same PR supersedes the in-flight run; without this,
# superseded runs burn to completion. Main pushes, nightly and manual runs
# share one group that never cancels the running run: a newer one replaces
# only a run still pending, and the tip it checks contains every replaced
# commit (nightly is the backstop). Per-commit main runs queued five deep
# at ~5 merges an hour (2026-11-04) and starved pull requests of the 20
# shared runners. A failing coalesced run: re-run PR Checks on the
# intermediate SHAs (`gh workflow run pr-checks.yml --ref <sha>`).
concurrency:
  group: pr-checks-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------
  # detect-changes gates the expensive jobs (scripts/ci/ci-changes.mjs).
  # Docs/openspec-only PRs no-op the build, browser, and code-only check
  # jobs; lint, format, unit shards (some read openspec/docs files), and
  # desktop lanes always run. `desktop` limits the win/mac packaging legs
  # (native better-sqlite3 rebuild, the slowest PR jobs) to changes in
  # desktop packaging inputs; Linux packs on every code change.
  # `pr-desktop` is `desktop` on pull requests and 'false' otherwise: main
  # pushes, nightly and manual runs pack win/mac in Desktop Packs
  # (desktop-packs.yml), outside this workflow's concurrency group.
  # `equipment`, `combat`, `corpus`, `roadmap` and `storybook` run their check
  # only when a changed file is in the check's import closure or is a
  # data file it reads. Detection fails open, and every gate is on outside
  # pull requests, so main and the nightly schedule run every check.
  # ---------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.filter.outputs.code }}
      combat: ${{ steps.filter.outputs.combat }}
      desktop: ${{ steps.filter.outputs.desktop }}
      pr-desktop: ${{ github.event_name == 'pull_request' && steps.filter.outputs.desktop || 'false' }}
      e2e: ${{ steps.filter.outputs.e2e }}
      equipment: ${{ steps.filter.outputs.equipment }}
      corpus: ${{ steps.filter.outputs.corpus }}
      roadmap: ${{ steps.filter.outputs.roadmap }}
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # A pull_request run checks out the merge commit; its first
          # parent is the base branch tip the change is diffed against.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Filter paths
        id: filter
        run: node scripts/ci/ci-changes.mjs

      - name: Test change detection and the Lint and Test guard
        run: node --test scripts/ci/ci-changes.test.mjs scripts/ci/lint-and-test-guard.test.mjs

  # ---------------------------------------------------------------
  # static-checks runs the short checks that used to take a runner
  # each (lint, format, roadmap ledger, determinism, typecheck, desktop
  # typecheck and tests, a11y, BV parity, Storybook, tsrs) on one
  # runner, so a PR run needs far fewer of the 20 concurrent jobs the
  # repository gets. Every check step runs even when an earlier one
  # fails (`!cancelled()`), so one run reports every failure. Gated
  # steps keep their old change-detection gates. It always runs: lint,
  # format, the roadmap ledger and typecheck cover docs/openspec-only
  # PRs too.
  # ---------------------------------------------------------------
  static-checks:
    name: Static Checks
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 13
    # Read-only token, not persisted: the advisory tsrs step installs and
    # runs a pinned third-party compiler.
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The roadmap ledger validator reads history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          build-caches: 'false'
          fetch-assets: 'true'

      - name: Restore Storybook cache
        if: ${{ !cancelled() && needs.detect-changes.outputs.storybook == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ hashFiles('package-lock.json', '.storybook/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-storybook-${{ hashFiles('package-lock.json', '.storybook/**') }}-

      - name: Enforce deterministic CI budgets and their red paths
        if: ${{ !cancelled() }}
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          node --test scripts/ci/*.test.mjs
          node scripts/ci/budget-check.mjs --report "$RUNNER_TEMP/budget-output/repository.json"

      - name: Test BV converted-input provenance gate
        if: ${{ !cancelled() }}
        run: >-
          npx jest --selectProjects unit --ci --maxWorkers=2 --runTestsByPath
          scripts/__tests__/unit-bv-provenance.test.ts
          scripts/__tests__/unit-bv-cache-provenance.test.ts

      - name: Upload deterministic budget census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-budget-repository
          path: ${{ runner.temp }}/budget-output/repository.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-head graphs and prove advisory reporting read-only
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/budget-github.mjs

      - name: Upload canonical reporter inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-budget-inputs
          path: ${{ runner.temp }}/budget-output/inputs.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload in-Actions reporter dry-run proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-budget-report-proof
          path: ${{ runner.temp }}/budget-output/report-dry-run.json
          if-no-files-found: warn
          retention-days: 7

      - name: Setup Python for Schema Bridge
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python schema-bridge deps
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        run: pip install jsonschema

      # Lever 4 (CI-SPEED round 2): Build Storybook and the two Python
      # schema-bridge checks (single-threaded) run in the background while
      # the foreground checks below use the other cores. Each still reports
      # as its own step, with its output and exit code
      # (scripts/ci/background-step.mjs); one that never starts or never
      # finishes fails its step. The corpus validation runs after the
      # conversion tests, as before.
      - name: Start Storybook and Python schema-bridge checks in the background
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ needs.detect-changes.outputs.code }}
          STORYBOOK: ${{ needs.detect-changes.outputs.storybook }}
        run: |
          if [ "$STORYBOOK" = true ]; then
            node scripts/ci/background-step.mjs start storybook -- npm run storybook:build
          fi
          if [ "$CODE" = true ]; then
            node scripts/ci/background-step.mjs start python-conversion -- npm run test:conversion:python
            # Drift in any of weapon / ammunition / electronics /
            # misc_equipment / physical_weapon / unit fails the build.
            node scripts/ci/background-step.mjs start corpus-validation --after python-conversion -- python scripts/megameklab-conversion/run_schema_validation_only.py --shape all --strict
          fi

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format Check
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Check generated work list after formatting
        if: ${{ !cancelled() }}
        run: node --test scripts/__tests__/v220-format.test.mjs

      - name: Validate roadmap ledger
        if: ${{ !cancelled() }}
        run: node openspec/planning/2026-09-12-roadmap-completion/validate-roadmap.mjs

      - name: Validate ledger validator tests
        if: ${{ !cancelled() }}
        run: node --test openspec/planning/2026-09-12-roadmap-completion/validate-roadmap.test.mjs

      # Delta specs change in docs/openspec-only PRs too: no code path gate.
      - name: Validate OpenSpec specs (strict)
        if: ${{ !cancelled() }}
        run: npm run openspec:validate

      - name: Validate OpenSpec delta headers and regression tests
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/qc/openspec-delta-headers.test.mjs
          npm run qc:openspec-ci:validate

      - name: Check v2.2.0 step map and fixtures
        if: ${{ !cancelled() }}
        run: |
          node scripts/qc/generate-v220-steps.mjs --check
          node --test scripts/__tests__/v220-steps.test.mjs
          node --test scripts/__tests__/v220-evidence.test.mjs

      # Per add-combat-fidelity-suite (Phase 0, Requirement: Audit of
      # Unseeded Dice in Combat Pipeline), `Math.random()` is forbidden
      # inside `src/utils/gameplay/` and `src/simulation/` outside the
      # `defaultD6Roller` definition site (`src/utils/gameplay/diceTypes.ts`).
      # Allowlist (legitimate non-dice entropy paths):
      #   - src/utils/gameplay/diceTypes.ts        — defaultD6Roller (the seam)
      #   - src/utils/gameplay/aerospace/criticalHits.ts — unused dead path
      #   - src/utils/gameplay/terrainGenerator.ts — seed fallback for procgen
      #   - src/simulation/QuickResolveService.ts  — crypto.getRandomValues fallback
      # Failures print the offending file and line.
      - name: Audit Math.random() in combat pipeline
        if: ${{ !cancelled() }}
        run: node scripts/qc/audit-combat-determinism.mjs

      - name: Generate Next.js route types
        if: ${{ !cancelled() }}
        run: npx next typegen

      - name: Type Check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Desktop Type Check
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm run type-check

      - name: Desktop Tests
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm test -- --runInBand

      # Gates accessibility regressions for in-scope components. Runs the
      # dedicated `a11y` Jest project — see jest.config.js for the
      # `**/*.a11y.test.(ts|tsx)` glob and jest.setup.a11y.ts for
      # `expect(...).toHaveNoViolations()` matchers.
      - name: A11y Tests
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        run: npx jest --selectProjects a11y --ci

      # The roadmap Jest project (config/jest/corpus-suites.js): tooling tests
      # that spawn the scripts/qc roadmap tools and read openspec/ files.
      - name: Roadmap tooling tests
        if: ${{ !cancelled() && needs.detect-changes.outputs.roadmap == 'true' }}
        run: npx jest --selectProjects roadmap --ci
        env:
          JEST_SPLIT_CORPUS: 'true'

      - name: Validate BV Parity
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        run: npm run validate:bv

      # Schema Bridge (folded in, CI-SPEED round 2): the cross-language
      # schema contract on code changes. Generated Zod must match the
      # canonical JSON Schema, and the Python validator passes the whole
      # corpus strictly. The TypeScript round-trip contract suites
      # (src/types/contracts) run in the unit shards; the equipment catalog
      # guard runs when a changed file is in its inputs (`equipment`).
      - name: Verify generated Zod matches JSON Schema
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        run: npm run schema:gen-check

      - name: Test schema generator fail-closed definitions
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        run: node --test scripts/__tests__/schema-local-definitions.test.mjs

      # The equipment catalog resolution guard adds about 1-4 minutes.
      - name: Test equipment catalog generator and resolution guards
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' && needs.detect-changes.outputs.equipment == 'true' }}
        run: node --test scripts/equipment-catalog/*.test.mjs

      # The checks started in the background report here, each as its own
      # step with its own output and exit code.
      - name: Test source inventory and Python conversion boundaries
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        timeout-minutes: 10
        run: node scripts/ci/background-step.mjs wait python-conversion

      - name: Validate full corpus (all 6 shapes, strict)
        if: ${{ !cancelled() && needs.detect-changes.outputs.code == 'true' }}
        timeout-minutes: 10
        run: node scripts/ci/background-step.mjs wait corpus-validation

      - name: Upload schema-bridge report
        if: ${{ always() && needs.detect-changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: schema-bridge-report
          path: validation-output/schema-bridge-report.json
          retention-days: 7

      - name: Build Storybook
        if: ${{ !cancelled() && needs.detect-changes.outputs.storybook == 'true' }}
        timeout-minutes: 10
        run: node scripts/ci/background-step.mjs wait storybook

      - name: Save Storybook cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.detect-changes.outputs.storybook == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ hashFiles('package-lock.json', '.storybook/**') }}-${{ github.sha }}

      # tsrs side-check: advisory only. continue-on-error and the step
      # timeouts keep it from ever failing this job, so it never blocks
      # Lint and Test.
      - name: Install isolated pinned tsrs (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/tsrs" tsrs@0.18.0-ts7.1.0-dev.20260929

      - name: Compare TS7 and verified tsrs diagnostics (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/qc/tsrs-side-check.mjs "$RUNNER_TEMP/tsrs"

  # ---------------------------------------------------------------
  # simulation-checks runs the simulation wall-clock, coverage and
  # statistical-proof lanes one after another on one runner (never
  # alongside other work, so the perf budgets measure an idle runner),
  # then builds the production app and packs the Linux Electron app from
  # that build (folded in from Build and Linux Pack, CI-SPEED round 2; it
  # runs after the budgets, so they still measure an idle runner). It
  # uploads `web-build` only when win/mac pack too. Code-only; the
  # 100-game proof runs only outside pull requests.
  # ---------------------------------------------------------------
  simulation-checks:
    name: Simulation Checks and Linux Pack
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The desktop lock pins both Electron and electron-builder exactly.
      # Restore before setup: npm ci can download Electron in its install hook.
      - name: Restore Electron downloads
        id: electron-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-v1-${{ hashFiles('desktop/package-lock.json') }}

      - name: Restore electron-builder downloads
        id: electron-builder-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-builder-cache-v1-${{ hashFiles('desktop/package-lock.json') }}

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'

      - name: Run CI-sized perf-sensitive simulation tests
        run: >-
          npx jest --selectProjects unit --ci --runInBand --runTestsByPath
          src/simulation/__tests__/integration.test.ts
          src/simulation/__tests__/simulation-combat-integration.test.ts
          src/simulation/__tests__/swarm-pilot-skills-batch.test.ts
          src/simulation/__tests__/swarm-throughput.test.ts
        env:
          SIMULATION_COUNT: '5'
          SIMULATION_COMBAT_DESTRUCTION_BATCH_COUNT: '10'
          SIMULATION_COMBAT_FULL_BATCH_COUNT: '3'
          SIMULATION_COMBAT_PILOT_DEATH_BATCH_COUNT: '3'
          SIMULATION_COMBAT_PSR_BATCH_COUNT: '3'
          SIMULATION_PILOT_SKILL_BATCH_COUNT: '5'
          SIMULATION_PROFILE_AVG_GAME_BUDGET_MS: '4500'
          SIMULATION_PROFILE_GAME_COUNT: '5'
          SIMULATION_PROFILE_RUNNER_BUDGET_MS: '4000'
          SIMULATION_PROFILE_TIME_BUDGET_MS: '30000'
          SWARM_THROUGHPUT_RUN_COUNT: '25'
          SWARM_THROUGHPUT_TIME_BUDGET_MS: '15000'

      - name: Run simulation wall-clock budgets
        if: ${{ !cancelled() }}
        run: >-
          npx jest --selectProjects unit --ci --runInBand --runTestsByPath
          src/simulation/__tests__/simulation.test.ts
          src/lib/multiplayer/server/__tests__/fogOfWar.test.ts
          src/lib/multiplayer/server/__tests__/campaignHostIntentServerTime.test.ts
          src/lib/multiplayer/server/__tests__/MatchStoreStress.test.ts
          src/__tests__/performance.test.tsx
        env:
          SIMULATION_PERF_ASSERTIONS: 'true'
          SIMULATION_COUNT: '10'

      - name: Generate combat/simulation coverage summary
        if: ${{ !cancelled() }}
        run: >-
          npx jest --selectProjects unit --ci --coverage
          --coverageDirectory=coverage/combat-simulation
          --coverageReporters=json-summary
          --coverageReporters=text-summary
          --runInBand
          --runTestsByPath
          src/simulation/__tests__/knownLimitations.test.ts
          src/simulation/__tests__/simulation.test.ts
          src/simulation/runner/__tests__/combatValidationScope.contract.test.ts
          --collectCoverageFrom='src/simulation/**/*.{ts,tsx}'
          --collectCoverageFrom='src/utils/gameplay/**/*.{ts,tsx}'
          --coverageThreshold='{}'
        env:
          JEST_EXCLUDE_PERF_SENSITIVE: 'true'
          SIMULATION_COUNT: '5'

      - name: Enforce combat/simulation coverage floors
        if: ${{ !cancelled() }}
        run: node scripts/qc/validate-combat-simulation-coverage.mjs --summary=coverage/combat-simulation/coverage-summary.json

      # simulation-system "Statistical Validation": the 100-game proof runs on
      # every main push and nightly (and on demand), not on pull requests.
      - name: Run 100-game statistical combat proofs
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: >-
          npx jest --selectProjects unit --ci --runInBand --runTestsByPath
          src/simulation/__tests__/integration.test.ts
        env:
          SIMULATION_COUNT: '100'
          SIMULATION_PROFILE_AVG_GAME_BUDGET_MS: '4500'
          SIMULATION_PROFILE_GAME_COUNT: '10'
          SIMULATION_PROFILE_RUNNER_BUDGET_MS: '4000'
          SIMULATION_PROFILE_TIME_BUDGET_MS: '60000'

      - name: Validate assets
        if: ${{ !cancelled() }}
        run: npm run validate:assets:strict

      - name: Build Next.js application
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Build Electron TypeScript
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm run build

      - name: Enforce complete web artifact byte budgets
        if: ${{ !cancelled() }}
        run: node scripts/ci/budget-artifacts.mjs --kind web --report "$RUNNER_TEMP/budget-output/web.json"

      - name: Upload complete package census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-budget-web
          path: ${{ runner.temp }}/budget-output/web.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload web build artifacts
        if: ${{ !cancelled() && needs.detect-changes.outputs.pr-desktop == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            .next/standalone
            .next/static
            desktop/dist
            public/record-sheets
          retention-days: 1
          # The standalone server lives in .next/standalone/.next; without
          # this the artifact silently drops it (Lane C, run 41790472413).
          include-hidden-files: true

      - name: Rebuild native modules for Linux
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: npm run rebuild:next-standalone

      - name: Save Electron downloads
        if: ${{ !cancelled() && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Build complete Linux installer and unpacked application
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: |
          # @electron/get fetches fresh checksums even for cached Electron zips.
          for attempt in 1 2 3; do
            echo "Linux packaging attempt $attempt/3"
            if npx electron-builder --linux tar.gz --publish never; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Linux packaging failed after 3 attempts (exit $status)"
              exit "$status"
            fi
            delay=$((attempt * 15))
            echo "::warning::Linux packaging failed (exit $status); retrying in ${delay}s"
            sleep "$delay"
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZATION: 'true'

      - name: Save electron-builder downloads
        if: ${{ !cancelled() && steps.electron-builder-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ steps.electron-builder-cache.outputs.cache-primary-key }}

      - name: Verify linux build output
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: test -d release/linux-unpacked

      - name: Prepare complete Linux installer inventory
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p desktop/release-upload
          cp desktop/release/*.tar.gz desktop/release-upload/

      - name: Enforce complete Linux installer byte budget
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/ci/budget-artifacts.mjs --kind installers --report "$RUNNER_TEMP/budget-output/installers.json"

      - name: Upload complete installer census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-budget-installers
          path: ${{ runner.temp }}/budget-output/installers.json
          if-no-files-found: error
          retention-days: 7

  # Three shards. jest.config.js uses every vCPU in CI (Lane B), and
  # JEST_SPLIT_CORPUS moves the whole-catalog suites to the `corpus` project
  # and the roadmap tooling suites to Static Checks
  # (config/jest/corpus-suites.js). Folded in (CI-SPEED round 2), so a PR
  # needs fewer runners:
  #   - shards 1 and 2 each run half of the corpus project after the unit
  #     shard, when a changed file is in its import closure or is
  #     catalog/converter data (always on main and nightly);
  #   - shard 3 runs the Validate Combat Suite when combat inputs changed.
  # The Jest transform cache is restored from main's last run: its entries
  # are keyed by file content and transformer config, so a stale entry can
  # never stand in for changed source. Main pushes and the nightly run save
  # it.
  unit-test-shards:
    name: Unit Tests (${{ matrix.shard }}/3)
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          build-caches: 'false'
          # The Validate Combat Suite (shard 3) reads the record-sheet assets.
          fetch-assets: ${{ matrix.shard == 3 && 'true' || 'false' }}

      - name: Restore Jest transform cache
        uses: actions/cache/restore@v5
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest.config.js', 'jest.setup.*', 'config/jest/**') }}-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest.config.js', 'jest.setup.*', 'config/jest/**') }}-unit-${{ matrix.shard }}-

      # 4 workers on the runner's 4 vCPUs: Lane B measured 10-20% faster unit
      # shards than Jest's default 3 (JOBS.md 0a); corpus/roadmap keep 3.
      # Lane B's per-file result cache (scripts/jest/cached-tests.js): on a
      # pull request a test file whose inputs (import closure, snapshot, data
      # it reads, env, config) match an earlier pass is skipped, and 3
      # sampled skips are re-run to prove the cache honest. Main pushes,
      # nightly and manual runs run every file uncached and record passes.
      # Any doubt runs the file.
      # Main's newest seed, then (on a PR) the PR's own earlier passes on
      # top. Entries are files named by their key, so the two merge. The
      # `main`/`pr` prefixes keep a PR's own entry from shadowing a newer
      # main seed (the cache searches the PR's ref before main's).
      - name: Restore Jest result seed from main
        uses: actions/cache/restore@v5
        with:
          path: .jest-result-cache
          key: ${{ runner.os }}-jest-results-unit-${{ matrix.shard }}-main-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-jest-results-unit-${{ matrix.shard }}-main-

      - name: Restore this PR's Jest results
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v5
        with:
          path: .jest-result-cache
          key: ${{ runner.os }}-jest-results-unit-${{ matrix.shard }}-pr-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-jest-results-unit-${{ matrix.shard }}-pr-

      - name: Run unit test shard
        run: >-
          node scripts/jest/cached-tests.js --project unit
          --shard ${{ matrix.shard }}/3 --verify-hits 3
          ${{ github.event_name != 'pull_request' && '--uncached' || '' }}
          --report jest-results-unit-${{ matrix.shard }}.json
          -- --ci --cacheDirectory=.jest-cache --maxWorkers=4
        env:
          JEST_EXCLUDE_PERF_SENSITIVE: 'true'
          JEST_SPLIT_CORPUS: 'true'

      # Saved straight after the tests, even if the run is then cancelled:
      # a PR's later pushes reuse its own passes, and PRs read main's.
      # Cache scoping keeps a PR's entries out of main's runs. Only passes
      # are recorded, so a failing shard adds nothing.
      - name: Save Jest result cache
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: .jest-result-cache
          key: ${{ runner.os }}-jest-results-unit-${{ matrix.shard }}-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}

      - name: Save Jest transform cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v5
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest.config.js', 'jest.setup.*', 'config/jest/**') }}-unit-${{ matrix.shard }}-${{ github.sha }}

      # Corpus half (shards 1 and 2): the whole-catalog suites replay the
      # committed catalog, with their own result store. The keys match the
      # former corpus-tests shards, but the new path changes the cache
      # version, so the first main run after this change seeds it again.
      - name: Restore corpus Jest result seed from main
        if: ${{ !cancelled() && matrix.shard != 3 && needs.detect-changes.outputs.corpus == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .jest-result-cache-corpus
          key: ${{ runner.os }}-jest-results-corpus-${{ matrix.shard }}-main-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-jest-results-corpus-${{ matrix.shard }}-main-

      - name: Restore this PR's corpus Jest results
        if: ${{ !cancelled() && matrix.shard != 3 && needs.detect-changes.outputs.corpus == 'true' && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v5
        with:
          path: .jest-result-cache-corpus
          key: ${{ runner.os }}-jest-results-corpus-${{ matrix.shard }}-pr-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-jest-results-corpus-${{ matrix.shard }}-pr-

      - name: Run corpus test shard
        if: ${{ !cancelled() && matrix.shard != 3 && needs.detect-changes.outputs.corpus == 'true' }}
        run: >-
          node scripts/jest/cached-tests.js --project corpus
          --shard ${{ matrix.shard }}/2 --verify-hits 1
          --cache-dir .jest-result-cache-corpus
          ${{ github.event_name != 'pull_request' && '--uncached' || '' }}
          --report jest-results-corpus-${{ matrix.shard }}.json
          -- --ci
        env:
          JEST_SPLIT_CORPUS: 'true'

      - name: Save corpus Jest result cache
        if: ${{ always() && matrix.shard != 3 && needs.detect-changes.outputs.corpus == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .jest-result-cache-corpus
          key: ${{ runner.os }}-jest-results-corpus-${{ matrix.shard }}-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}

      # Shard 3: combat catalog/test/spec consistency
      # (scripts/validate-combat-suite.mjs) when combat inputs changed.
      - name: Validate Combat Suite
        if: ${{ !cancelled() && matrix.shard == 3 && needs.detect-changes.outputs.combat == 'true' }}
        run: npm run validate:combat

      - name: Upload actual Jest timing and cache observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-budget-jest-${{ matrix.shard }}
          path: jest-results-*.json
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------
  # e2e runs every per-PR Playwright gate in 2 shards. Each shard
  # fetches and strictly validates the record-sheet assets in its own
  # checkout (a missing template fails here instead of degrading to the
  # CDN fallback) and builds the E2E-mode production app itself: a
  # separate build job plus an artifact hop took one more runner than a
  # second build costs (CI-SPEED slice 5, 12-job budget).
  # NEXT_PUBLIC_E2E_* are inlined at build time, and a non-E2E production
  # build swaps the tactical-map E2E harness for an empty stub
  # (next.config.ts), so it needs a separate build from the Linux pack job
  # (simulation-checks after CI-SPEED lever 3).
  #   - gate specs (the seam trust anchors, design R4, and the
  #     customizer regressions) run with --retries=0, so a flaky
  #     anchor can never retry to green, and with
  #     --trace=retain-on-failure, because the config's
  #     `trace: 'on-first-retry'` records nothing at zero retries. They
  #     run on one worker, as before: under 4 workers the customizer
  #     packs time out (run 41810648418).
  #   - smoke specs keep the config's CI retries. The library suite runs
  #     on one worker (its flows share the server database); the
  #     tactical-map visual smoke uses all 4 vCPUs of the runner.
  # run-ci-e2e allocates the live census across BOTH shards by recorded
  # durations (config/playwright/ci-durations.json), across suite boundaries.
  # Gate files and the serial smoke file remain atomic; independent library
  # tests keep one worker. A timing miss changes only a weight. Native
  # --test-list selection and executed reports must match the planned set.
  # The wrapper owns the HTML/JSON report paths and overrides step-level
  # PLAYWRIGHT_* report env vars; its listing timings upload in e2e-timings.
  # Step gating keeps docs- and openspec-only PRs green.
  # ---------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.shard }}/2)
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Skip (no code or e2e changes)
        if: needs.detect-changes.outputs.code != 'true' && needs.detect-changes.outputs.e2e != 'true'
        run: echo "No code or e2e changes — skipping E2E."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        id: setup
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          verify-native-modules: 'true'
          fetch-assets: 'true'

      - name: Test E2E shard planning and coverage guards
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        run: node --test scripts/playwright/ci-e2e-plan.test.mjs

      - name: Validate record-sheet assets
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        run: npm run validate:assets:strict

      - name: Build production app
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        env:
          NEXT_PUBLIC_E2E_MODE: 'true'
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: npm run build

      - name: Resolve Playwright version for browser cache key
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        id: playwright-version
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium browser
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.setup.outputs.cache-platform }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium browser
        if: (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run seam anchor, customizer and GM ledger regression gates
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          # The smoke steps write their own report folders.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-gates
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-timings/gates.json
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/active-session-recovery.spec.ts e2e/seam-roster-materialization-handoff.spec.ts e2e/seam-fresh-construction-no-instant-defeat.spec.ts e2e/customizer-equipment-catalog.spec.ts e2e/customizer-record-sheet-rendering.spec.ts e2e/customizer-edit-recovery.spec.ts e2e/gm-campaign-ledger-control-plane.spec.ts --project=chromium --retries=0 --trace=retain-on-failure --workers=1 --shard=${{ matrix.shard }}/2 --output=test-results/gates

      # The library flows save and reopen units through the shared server
      # database, and both viewport variants of a family save the same
      # chassis, so they run on one worker as before (run 41813722683).
      - name: Run customizer library suite
        if: ${{ !cancelled() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') }}
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-library
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-timings/library.json
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/customizer-library-open.spec.ts --project=chromium --workers=1 --shard=${{ matrix.shard }}/2 --output=test-results/library

      - name: Run tactical-map visual smoke
        if: ${{ !cancelled() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') }}
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-timings/smoke.json
        run: node scripts/playwright/run-ci-e2e.mjs test e2e/tactical-map-visual-smoke.spec.ts --project=chromium --workers=4 --shard=${{ matrix.shard }}/2 --output=test-results/smoke

      - name: Upload E2E durations and test census
        if: always() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: e2e-timings
          if-no-files-found: error
          retention-days: 3

      - name: Upload library-open screenshots
        if: always() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: library-open-screenshots-${{ matrix.shard }}
          path: test-results/library/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: failure() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report
            playwright-report-gates
            playwright-report-library
            playwright-report-smoke
            test-results
          retention-days: 7

  # Aggregator that preserves the "Lint and Test" required-check name.
  # Runs UNCONDITIONALLY (if: always()): GitHub counts a needs-skipped
  # required check as passing, so without it a failed fan-out job would
  # skip this aggregator and the PR would show green (the
  # run-29059132882 hole; W6 design D2.3/R10). A needed job passes when
  # its result is 'success'. It may be 'skipped' only when it carries a
  # job-level `if:` on detect-changes gates and every gate it names
  # below was 'false' for this run; any other skip, a failure or a
  # cancellation fails this check. Add every new job to `needs`, and a
  # job-level-gated job to GATES too.
  lint-and-test:
    name: Lint and Test
    if: always()
    needs:
      [
        detect-changes,
        static-checks,
        unit-test-shards,
        simulation-checks,
        build-test,
        e2e,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout aggregator contract
        uses: actions/checkout@v6
      - name: Assert every fan-out check succeeded or was gated off
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Job id -> the detect-changes gates whose all-'false' allows a skip.
          GATES_JSON: '{"simulation-checks":"code","build-test":"pr-desktop"}'
        run: node scripts/ci/budget-aggregate.mjs

      - name: Enforce budget-raise approval with read-only live inputs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const { checkBudgetPolicy } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/budget-approval.mjs`);
            const result = await checkBudgetPolicy({ github, ...context.repo,
              number: context.payload.pull_request.number, publish: false });
            core.info(JSON.stringify(result));
            if (!result.allowed) throw new Error(result.message);

  # build-test packs Windows and macOS (native module rebuild, the slowest
  # legs) on a pull request whose changes reach desktop packaging inputs;
  # otherwise neither leg takes a runner. Linux packs in simulation-checks
  # on every code change. Main pushes, nightly and manual runs pack win/mac in
  # Desktop Packs (desktop-packs.yml) instead: a macOS leg waiting for a
  # runner held this workflow's main group, so every later main run queued
  # behind it and was replaced (run 41923023147, 2026-11-04).
  build-test:
    name: Build Test / ${{ matrix.platform }}
    needs: [detect-changes, simulation-checks]
    if: needs.detect-changes.outputs.pr-desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          # Pinned: since 2026-11-04 ~14:45Z no `macos-latest` job here was
          # acquired by a hosted runner ("not acquired ... after multiple
          # attempts"), which cancelled the leg and failed Lint and Test.
          - os: macos-15
            platform: mac
    timeout-minutes: 5
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Electron downloads
        id: electron-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-v1-${{ hashFiles('desktop/package-lock.json') }}

      - name: Restore electron-builder downloads
        id: electron-builder-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-builder-cache-v1-${{ hashFiles('desktop/package-lock.json') }}

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          skip-nextjs-cache: 'true'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-build

      - name: Restore artifact structure
        shell: bash
        run: |
          # download-artifact extracts to the current directory, preserving
          # structure. Verify the artifacts are in place.
          test -d .next/standalone || { echo "Missing .next/standalone"; exit 1; }
          test -d public/record-sheets || { echo "Missing public/record-sheets"; exit 1; }
          test -d .next/static || { echo "Missing .next/static"; exit 1; }
          test -d desktop/dist || { echo "Missing desktop/dist"; exit 1; }
          test -f .next/standalone/.next/BUILD_ID || { echo "Missing .next/standalone/.next/BUILD_ID"; exit 1; }

      - name: Rebuild native modules for platform
        working-directory: desktop
        shell: bash
        run: npm run rebuild:next-standalone

      - name: Save Electron downloads
        if: ${{ !cancelled() && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Test Electron build (pack mode)
        working-directory: desktop
        shell: bash
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZATION: 'true'

      - name: Save electron-builder downloads
        if: ${{ !cancelled() && steps.electron-builder-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ steps.electron-builder-cache.outputs.cache-primary-key }}

      - name: Verify build output
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            test -d release/win-unpacked || exit 1
            test -f release/win-unpacked/"MekStation.exe" || exit 1
          else
            mac_apps="$(compgen -G "release/mac*/MekStation.app")"
            [ -n "$mac_apps" ] || exit 1
          fi
