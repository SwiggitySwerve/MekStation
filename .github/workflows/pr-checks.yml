name: PR Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR supersedes the in-flight run; without this,
# superseded runs burn to completion (~52 job-minutes each).
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------
  # detect-changes gates the expensive jobs. Docs/openspec-only PRs
  # no-op the build, browser, and code-only check jobs; lint, format,
  # unit shards (some read openspec/docs files), and desktop lanes
  # always run. `combat` adds the openspec specs/changes that
  # validate:combat reads. `desktop` limits the win/mac packaging legs
  # (native better-sqlite3 rebuild, the slowest PR jobs) to changes in
  # desktop packaging inputs; Linux packs on every code change.
  # ---------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      combat: ${{ steps.filter.outputs.combat }}
      desktop: ${{ steps.filter.outputs.desktop }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code: &code
              - 'src/**'
              - 'public/**'
              - 'desktop/**'
              - 'scripts/**'
              - 'config/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'jest.config.*'
              - 'jest.setup.*'
              - '.babelrc*'
              - 'server.js'
              - 'electron-builder.yml'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - '.storybook/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            combat:
              - *code
              - 'openspec/specs/**'
              - 'openspec/changes/**'
            desktop:
              - 'desktop/**'
              - 'electron-builder.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'server.js'
              - 'next.config.*'
              - 'scripts/next/**'
              - 'scripts/hydrate-next-standalone-multiplayer-server.mjs'
              - '.github/workflows/pr-checks.yml'
              - '.github/actions/**'
            e2e:
              - 'e2e/**'
              - 'playwright.config.*'

  # ---------------------------------------------------------------
  # install-deps runs first so the other lint/test/type/build jobs
  # can reuse a single `npm ci`. It populates the node_modules cache
  # keyed on (OS, node version, lockfile hash); fan-out jobs restore
  # from that cache and skip `npm ci` entirely on a hit.
  # ---------------------------------------------------------------
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'

  lint:
    name: Lint
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run linter
        run: npm run lint

  format-check:
    name: Format Check
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Check formatting
        run: npm run format:check

      - name: Check generated work list after formatting
        run: node --test scripts/__tests__/v220-format.test.mjs

  validate-roadmap:
    name: Validate Roadmap Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate roadmap ledger
        run: node openspec/planning/2026-09-12-roadmap-completion/validate-roadmap.mjs

      - name: Validate ledger validator tests
        run: node --test openspec/planning/2026-09-12-roadmap-completion/validate-roadmap.test.mjs

      - name: Check v2.2.0 step map and fixtures
        run: |
          node scripts/qc/generate-v220-steps.mjs --check
          node --test scripts/__tests__/v220-steps.test.mjs
          node --test scripts/__tests__/v220-evidence.test.mjs

  typecheck:
    name: Type Check
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Run type check
        run: npm run typecheck

  # Advisory only: never add this job to lint-and-test.needs or branch protection.
  tsrs-side-check:
    name: tsrs Side-Check (advisory)
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Install isolated pinned tsrs
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/tsrs" tsrs@0.18.0-ts7.1.0-dev.20260929

      - name: Compare TS7 and verified tsrs diagnostics
        run: node scripts/qc/tsrs-side-check.mjs "$RUNNER_TEMP/tsrs"

  unit-test-shards:
    name: Unit Tests (${{ matrix.shard }}/6)
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run unit test shard
        run: npx jest --selectProjects unit --ci --shard=${{ matrix.shard }}/6
        env:
          JEST_EXCLUDE_PERF_SENSITIVE: 'true'

  perf-smoke-tests:
    name: Perf Smoke Tests
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run CI-sized perf-sensitive simulation tests
        if: needs.detect-changes.outputs.code == 'true'
        run: >-
          npx jest --selectProjects unit --ci --runInBand --runTestsByPath
          src/simulation/__tests__/integration.test.ts
          src/simulation/__tests__/simulation-combat-integration.test.ts
          src/simulation/__tests__/swarm-pilot-skills-batch.test.ts
          src/simulation/__tests__/swarm-throughput.test.ts
        env:
          SIMULATION_COUNT: '5'
          SIMULATION_COMBAT_DESTRUCTION_BATCH_COUNT: '10'
          SIMULATION_COMBAT_FULL_BATCH_COUNT: '3'
          SIMULATION_COMBAT_PILOT_DEATH_BATCH_COUNT: '3'
          SIMULATION_COMBAT_PSR_BATCH_COUNT: '3'
          SIMULATION_PILOT_SKILL_BATCH_COUNT: '5'
          SIMULATION_PROFILE_AVG_GAME_BUDGET_MS: '4500'
          SIMULATION_PROFILE_GAME_COUNT: '5'
          SIMULATION_PROFILE_RUNNER_BUDGET_MS: '4000'
          SIMULATION_PROFILE_TIME_BUDGET_MS: '30000'
          SWARM_THROUGHPUT_RUN_COUNT: '25'
          SWARM_THROUGHPUT_TIME_BUDGET_MS: '15000'

  statistical-proof-pr:
    name: Statistical Proof PR
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run 100-game statistical combat proofs
        if: needs.detect-changes.outputs.code == 'true'
        run: >-
          npx jest --selectProjects unit --ci --runInBand --runTestsByPath
          src/simulation/__tests__/integration.test.ts
        env:
          SIMULATION_COUNT: '100'
          SIMULATION_PROFILE_AVG_GAME_BUDGET_MS: '4500'
          SIMULATION_PROFILE_GAME_COUNT: '10'
          SIMULATION_PROFILE_RUNNER_BUDGET_MS: '4000'
          SIMULATION_PROFILE_TIME_BUDGET_MS: '60000'

  perf-budget-pr:
    name: Perf Budget PR
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run simulation wall-clock budgets
        if: needs.detect-changes.outputs.code == 'true'
        run: >-
          npx jest --selectProjects unit --ci --runInBand --runTestsByPath
          src/simulation/__tests__/simulation.test.ts
        env:
          SIMULATION_PERF_ASSERTIONS: 'true'
          SIMULATION_COUNT: '10'

  coverage-floor:
    name: Coverage Floor
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Generate combat/simulation coverage summary
        if: needs.detect-changes.outputs.code == 'true'
        run: >-
          npx jest --selectProjects unit --ci --coverage
          --coverageDirectory=coverage/combat-simulation
          --coverageReporters=json-summary
          --coverageReporters=text-summary
          --runInBand
          --runTestsByPath
          src/simulation/__tests__/knownLimitations.test.ts
          src/simulation/__tests__/simulation.test.ts
          src/simulation/runner/__tests__/combatValidationScope.contract.test.ts
          --collectCoverageFrom='src/simulation/**/*.{ts,tsx}'
          --collectCoverageFrom='src/utils/gameplay/**/*.{ts,tsx}'
          --coverageThreshold='{}'
        env:
          JEST_EXCLUDE_PERF_SENSITIVE: 'true'
          SIMULATION_COUNT: '5'

      - name: Enforce combat/simulation coverage floors
        if: needs.detect-changes.outputs.code == 'true'
        run: node scripts/qc/validate-combat-simulation-coverage.mjs --summary=coverage/combat-simulation/coverage-summary.json

  a11y-tests:
    name: A11y Tests
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run a11y tests (axe-core)
        if: needs.detect-changes.outputs.code == 'true'
        # Gates accessibility regressions for in-scope components. Runs
        # the dedicated `a11y` Jest project — see jest.config.js for the
        # `**/*.a11y.test.(ts|tsx)` glob and jest.setup.a11y.ts for
        # `expect(...).toHaveNoViolations()` matchers.
        run: npx jest --selectProjects a11y --ci

  validate-bv:
    name: Validate BV Parity
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'

      - name: Validate BV parity
        if: needs.detect-changes.outputs.code == 'true'
        run: npm run validate:bv

  validate-combat:
    name: Validate Combat Suite
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip (no code or openspec spec changes)
        if: needs.detect-changes.outputs.combat != 'true'
        run: echo "No code or openspec spec changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.combat == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.combat == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'

      - name: Validate combat catalog/test/spec consistency
        if: needs.detect-changes.outputs.combat == 'true'
        run: npm run validate:combat

  storybook-build:
    name: Build Storybook
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Build Storybook
        if: needs.detect-changes.outputs.code == 'true'
        run: npm run storybook:build

  # ---------------------------------------------------------------
  # schema-bridge gates the cross-language schema contract:
  #   1. Generated Zod matches the canonical JSON Schema source
  #   2. Python validator passes on the corpus (PR-A1 = weapon only,
  #      non-strict; PR-A2 will flip to --strict --shape all)
  #   3. TypeScript round-trip Jest tests pass for the weapon shape
  # The job runs in parallel after install-deps and is included in
  # the `lint-and-test` aggregator so branch protection picks it up.
  # ---------------------------------------------------------------
  schema-bridge:
    name: Schema Bridge
    needs: [detect-changes, install-deps]
    runs-on: ubuntu-latest
    # The equipment catalog resolution guard adds about 2.5 minutes.
    timeout-minutes: 10

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Setup Python
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python schema-bridge deps
        if: needs.detect-changes.outputs.code == 'true'
        run: pip install jsonschema

      - name: Verify generated Zod matches JSON Schema
        if: needs.detect-changes.outputs.code == 'true'
        run: npm run schema:gen-check

      - name: Test schema generator fail-closed definitions
        if: needs.detect-changes.outputs.code == 'true'
        run: node --test scripts/__tests__/schema-local-definitions.test.mjs

      - name: Test equipment catalog generator and resolution guards
        if: needs.detect-changes.outputs.code == 'true'
        run: node --test scripts/equipment-catalog/*.test.mjs

      - name: Test source inventory and Python conversion boundaries
        if: needs.detect-changes.outputs.code == 'true'
        run: npm run test:conversion:python

      - name: Validate full corpus (all 6 shapes, strict)
        if: needs.detect-changes.outputs.code == 'true'
        # PR-A2 flips the gate to --shape all --strict. Drift in any of
        # weapon / ammunition / electronics / misc_equipment /
        # physical_weapon / unit fails the build immediately.
        run: python scripts/megameklab-conversion/run_schema_validation_only.py --shape all --strict

      - name: Run cross-language schema-bridge Jest tests
        if: needs.detect-changes.outputs.code == 'true'
        # All 6 contract test suites (weapon + unit + ammunition +
        # electronics + misc-equipment + physical-weapon).
        run: npx jest src/types/contracts --ci --no-coverage

      - name: Upload schema-bridge report
        if: always() && needs.detect-changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: schema-bridge-report
          path: validation-output/schema-bridge-report.json
          retention-days: 7

  # ---------------------------------------------------------------
  # determinism-audit gates non-determinism in the combat pipeline.
  # Per add-combat-fidelity-suite (Phase 0, Requirement: Audit of
  # Unseeded Dice in Combat Pipeline), `Math.random()` is forbidden
  # inside `src/utils/gameplay/` and `src/simulation/` outside the
  # `defaultD6Roller` definition site (`src/utils/gameplay/diceTypes.ts`).
  #
  # Allowlist (legitimate non-dice entropy paths):
  #   - src/utils/gameplay/diceTypes.ts        — defaultD6Roller (the seam)
  #   - src/utils/gameplay/aerospace/criticalHits.ts — unused dead path
  #   - src/utils/gameplay/terrainGenerator.ts — seed fallback for procgen
  #   - src/simulation/QuickResolveService.ts  — crypto.getRandomValues fallback
  #
  # Failures print the offending file and line so CI logs identify the
  # regression site directly.
  # ---------------------------------------------------------------
  determinism-audit:
    name: Determinism Audit
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Audit Math.random() in combat pipeline
        run: node scripts/qc/audit-combat-determinism.mjs

  # ---------------------------------------------------------------
  # e2e-build builds the E2E-mode production app ONCE per run and
  # hands it to every Playwright shard, so no shard compiles Next and
  # no shard runs `next dev` (which compiled each route on demand).
  # It is a separate build from prepare-build on purpose:
  # NEXT_PUBLIC_E2E_* are inlined at build time, and a non-E2E
  # production build swaps the tactical-map E2E harness for an empty
  # stub (next.config.ts), so the Electron pack must not consume this
  # one. The record-sheet assets are fetched and strictly validated in
  # THIS job's checkout, and the build copies them into the standalone
  # public/ the shards serve, so a missing template fails here instead
  # of degrading to the CDN fallback. Step gating keeps docs- and
  # openspec-only PRs green for the lint-and-test aggregator.
  # ---------------------------------------------------------------
  e2e-build:
    name: E2E Build
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip (no code or e2e changes)
        if: needs.detect-changes.outputs.code != 'true' && needs.detect-changes.outputs.e2e != 'true'
        run: echo "No code or e2e changes — skipping the E2E build."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'

      - name: Validate record-sheet assets
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        run: npm run validate:assets:strict

      - name: Build production app
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        env:
          NEXT_PUBLIC_E2E_MODE: 'true'
          NEXT_PUBLIC_E2E_TEST: 'true'
        run: npm run build

      # One zstd tarball instead of tens of thousands of zip entries:
      # keeps symlinks and modes in the standalone node_modules and makes
      # the upload and download a single stream.
      - name: Pack standalone build
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        run: tar -cf - .next/standalone | zstd -T0 -3 -q -o "$RUNNER_TEMP/e2e-build.tar.zst"

      - name: Upload E2E build
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: ${{ runner.temp }}/e2e-build.tar.zst
          compression-level: 0
          retention-days: 1

  # ---------------------------------------------------------------
  # e2e runs every per-PR Playwright gate against the E2E Build's
  # standalone server, in 3 shards. It replaces the former E2E Smoke,
  # Seam Anchors and Customizer Regressions jobs with the same spec
  # files and the same retry policy:
  #   - gate specs (the seam trust anchors, design R4, and the
  #     customizer regressions) run with --retries=0, so a flaky
  #     anchor can never retry to green, and with
  #     --trace=retain-on-failure, because the config's
  #     `trace: 'on-first-retry'` records nothing at zero retries. They
  #     run on one worker, as before: under 4 workers the customizer
  #     packs time out (run 41810648418).
  #   - smoke specs keep the config's CI retries. The library suite runs
  #     on one worker (its flows share the server database); the
  #     tactical-map visual smoke uses all 4 vCPUs of the runner.
  # Each group is sharded on its own, so every shard runs a slice of
  # both. Step gating keeps docs- and openspec-only PRs green.
  # ---------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.shard }}/3)
    needs: [detect-changes, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Skip (no code or e2e changes)
        if: needs.detect-changes.outputs.code != 'true' && needs.detect-changes.outputs.e2e != 'true'
        run: echo "No code or e2e changes — skipping E2E."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          skip-nextjs-cache: 'true'

      - name: Resolve Playwright version for browser cache key
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        id: playwright-version
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium browser
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium browser
        if: (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download E2E build
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        uses: actions/download-artifact@v8
        with:
          name: e2e-build
          path: ${{ runner.temp }}

      - name: Unpack E2E build
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        run: zstd -dc -q "$RUNNER_TEMP/e2e-build.tar.zst" | tar -xf - && test -f .next/standalone/server.js

      - name: Run seam anchor and customizer regression gates
        if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true'
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          # The smoke step writes the default report folder.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-gates
        run: node scripts/playwright/run-playwright.mjs test e2e/active-session-recovery.spec.ts e2e/seam-roster-materialization-handoff.spec.ts e2e/seam-fresh-construction-no-instant-defeat.spec.ts e2e/customizer-equipment-catalog.spec.ts e2e/customizer-record-sheet-rendering.spec.ts e2e/customizer-edit-recovery.spec.ts --project=chromium --retries=0 --trace=retain-on-failure --workers=1 --shard=${{ matrix.shard }}/3 --output=test-results/gates

      # The library flows save and reopen units through the shared server
      # database, and both viewport variants of a family save the same
      # chassis, so they run on one worker as before (run 41813722683).
      - name: Run customizer library suite
        if: ${{ !cancelled() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') }}
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-library
        run: node scripts/playwright/run-playwright.mjs test e2e/customizer-library-open.spec.ts --project=chromium --workers=1 --shard=${{ matrix.shard }}/3 --output=test-results/library

      - name: Run tactical-map visual smoke
        if: ${{ !cancelled() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true') }}
        env:
          MEKSTATION_E2E_SERVER_COMMAND: 'node .next/standalone/server.js'
          HOSTNAME: '127.0.0.1'
        run: node scripts/playwright/run-playwright.mjs test e2e/tactical-map-visual-smoke.spec.ts --project=chromium --workers=4 --shard=${{ matrix.shard }}/3 --output=test-results/smoke

      - name: Upload library-open screenshots
        if: always() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: library-open-screenshots-${{ matrix.shard }}
          path: test-results/library/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: failure() && (needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report
            playwright-report-gates
            playwright-report-library
            test-results
          retention-days: 7

  desktop-typecheck:
    name: Desktop Type Check
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run desktop type check
        working-directory: desktop
        run: npm run type-check

  desktop-tests:
    name: Desktop Tests
    needs: install-deps
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'

      - name: Run desktop Jest suite
        working-directory: desktop
        run: npm test -- --runInBand

  # Aggregator that preserves the "Lint and Test" required-check name
  # from before the fan-out. Runs UNCONDITIONALLY (if: always()) and
  # fails unless every needed job's result is 'success' — GitHub counts
  # a needs-skipped required check as passing, so without the assertion
  # a failed fan-out job skips this aggregator and the PR shows green
  # (the run-29059132882 hole; W6 design D2.3/R10). 'skipped' and
  # 'cancelled' results are defects too: no needed job carries a
  # job-level `if:` (verified in W6 task 1.1), so anything other than
  # 'success' means a real failure upstream.
  lint-and-test:
    name: Lint and Test
    if: always()
    needs:
      [
        lint,
        format-check,
        validate-roadmap,
        typecheck,
        unit-test-shards,
        perf-smoke-tests,
        statistical-proof-pr,
        perf-budget-pr,
        coverage-floor,
        a11y-tests,
        validate-bv,
        validate-combat,
        storybook-build,
        schema-bridge,
        determinism-audit,
        e2e-build,
        e2e,
        desktop-typecheck,
        desktop-tests,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Assert every fan-out check succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "Non-success needed jobs:"
            echo "$failed"
            exit 1
          fi
          echo "All fan-out checks passed"

  # prepare-build always runs (to satisfy branch-protection required check
  # names), but its work is gated per-step on detect-changes.outputs.code.
  # Docs/openspec-only PRs early-exit with a no-op step.
  prepare-build:
    name: Prepare Build Artifacts
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip (no code changes)
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "No code changes — skipping build."

      - name: Checkout code
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: needs.detect-changes.outputs.code == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          fetch-assets: 'true'

      - name: Validate assets
        if: needs.detect-changes.outputs.code == 'true'
        run: npm run validate:assets:strict

      - name: Build Next.js application
        if: needs.detect-changes.outputs.code == 'true'
        run: npm run build

      - name: Build Electron TypeScript
        if: needs.detect-changes.outputs.code == 'true'
        working-directory: desktop
        run: npm run build

      - name: Upload web build artifacts
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            .next/standalone
            .next/static
            desktop/dist
            public/record-sheets
          retention-days: 1

  # build-test always runs so the per-platform required checks
  # ("Build Test / win", etc.) report SUCCESS on docs-only PRs.
  # Work is gated per-step on RUN_BUILD_TEST: Linux packs on every code
  # change; win/mac add ~8 job-minutes (native module rebuild) and only
  # run when detect-changes.outputs.desktop flags packaging inputs.
  build-test:
    name: Build Test / ${{ matrix.platform }}
    needs: [detect-changes, prepare-build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    timeout-minutes: 30
    env:
      RUN_BUILD_TEST: ${{ needs.detect-changes.outputs.code == 'true' && (matrix.platform == 'linux' || needs.detect-changes.outputs.desktop == 'true') }}

    steps:
      - name: Skip (no code changes, or no desktop changes on win/mac)
        if: env.RUN_BUILD_TEST != 'true'
        run: echo "No code changes, or no desktop packaging changes on ${{ matrix.platform }} — skipping build."

      - name: Checkout code
        if: env.RUN_BUILD_TEST == 'true'
        uses: actions/checkout@v6

      - name: Setup Node + caches + install deps
        if: env.RUN_BUILD_TEST == 'true'
        uses: ./.github/actions/setup-node-and-install
        with:
          node-version: '22'
          skip-nextjs-cache: 'true'

      - name: Download build artifacts
        if: env.RUN_BUILD_TEST == 'true'
        uses: actions/download-artifact@v8
        with:
          name: web-build

      - name: Restore artifact structure
        if: env.RUN_BUILD_TEST == 'true'
        shell: bash
        run: |
          # Move downloaded artifacts to their correct locations
          # download-artifact extracts to current directory preserving structure
          # Verify the artifacts are in place
          test -d .next/standalone || { echo "Missing .next/standalone"; exit 1; }
          test -d public/record-sheets || { echo "Missing public/record-sheets"; exit 1; }
          test -d .next/static || { echo "Missing .next/static"; exit 1; }
          test -d desktop/dist || { echo "Missing desktop/dist"; exit 1; }

      - name: Rebuild native modules for platform
        if: env.RUN_BUILD_TEST == 'true'
        working-directory: desktop
        shell: bash
        run: npm run rebuild:next-standalone

      - name: Test Electron build (pack mode)
        if: env.RUN_BUILD_TEST == 'true'
        working-directory: desktop
        shell: bash
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZATION: 'true'
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/desktop/.electron-cache

      - name: Verify build output
        if: env.RUN_BUILD_TEST == 'true'
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            test -d release/win-unpacked || exit 1
            test -f release/win-unpacked/"MekStation.exe" || exit 1
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            mac_dirs="$(compgen -G "release/mac*")"
            if [ -n "$mac_dirs" ]; then
              mac_apps="$(compgen -G "release/mac*/MekStation.app")"
              [ -n "$mac_apps" ] || exit 1
            else
              exit 1
            fi
          else
            test -d release/linux-unpacked || exit 1
          fi
